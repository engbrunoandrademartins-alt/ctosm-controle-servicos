<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Serviços — CTOSM/SMS Cuiabá</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
:root{
  --bg:#F2F3F0;
  --surface:#FFFFFF;
  --ink:#1B2430;
  --ink-soft:#5B6472;
  --line:#DBDFDD;
  --line-soft:#E9EBE8;
  --navy:#1F3A5C;
  --navy-deep:#132A44;
  --ochre:#B5761E;
  --ochre-soft:#F4E6CE;
  --st-nao-fg:#5B6472; --st-nao-bg:#E7E9E6;
  --st-and-fg:#96590A; --st-and-bg:#FBEEDA;
  --st-fin-fg:#2B7A4B; --st-fin-bg:#E1F2E7;
  --st-esp-fg:#2A5C8A; --st-esp-bg:#E3EEF7;
  --st-rec-fg:#A6392F; --st-rec-bg:#F9E4E1;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'IBM Plex Sans', sans-serif;
  font-size:14px;
  line-height:1.5;
}
h1,h2,h3,h4{
  font-family:'Space Grotesk', sans-serif;
  margin:0;
  color:var(--ink);
  font-weight:600;
}
.mono{font-family:'IBM Plex Mono', monospace;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}

/* ---- Header ---- */
.app-header{
  background:var(--navy);
  color:#fff;
  padding:22px clamp(16px,4vw,40px) 0;
}
.app-header .title-row{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:16px;
  flex-wrap:wrap;
  padding-bottom:18px;
  border-bottom:1px solid rgba(255,255,255,0.14);
}
.app-header h1{
  color:#fff;
  font-size:22px;
  letter-spacing:0.2px;
}
.app-header .subtitle{
  color:rgba(255,255,255,0.68);
  font-size:12.5px;
  margin-top:4px;
}
.app-header .meta{
  color:rgba(255,255,255,0.55);
  font-size:12px;
  text-align:right;
}
.tabs{
  display:flex;
  gap:4px;
  padding-top:10px;
}
.tab-btn{
  background:none;
  border:none;
  color:rgba(255,255,255,0.62);
  padding:10px 16px;
  font-size:13.5px;
  font-weight:500;
  border-bottom:2px solid transparent;
  transition:color .15s ease, border-color .15s ease;
}
.tab-btn:hover{color:#fff;}
.tab-btn.active{
  color:#fff;
  border-bottom-color:var(--ochre);
}

/* ---- Layout ---- */
.wrap{
  max-width:1180px;
  margin:0 auto;
  padding:24px clamp(16px,4vw,40px) 60px;
}
.section-title{
  font-size:11.5px;
  text-transform:uppercase;
  letter-spacing:0.06em;
  color:var(--ink-soft);
  margin-bottom:10px;
  font-weight:600;
}
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:6px;
}

/* ---- KPIs ---- */
.kpi-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
  margin-bottom:24px;
}
.kpi{
  padding:16px 18px;
}
.kpi .num{
  font-family:'Space Grotesk',sans-serif;
  font-size:26px;
  font-weight:700;
  line-height:1.1;
}
.kpi .label{
  font-size:12px;
  color:var(--ink-soft);
  margin-top:4px;
}
.kpi.total .num{color:var(--navy);}
.kpi.nao .num{color:var(--st-nao-fg);}
.kpi.and .num{color:var(--st-and-fg);}
.kpi.fin .num{color:var(--st-fin-fg);}
.kpi.esp .num{color:var(--st-esp-fg);}

/* ---- Filters ---- */
.filters{
  padding:16px 18px;
  margin-bottom:20px;
}
.filters-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;
  align-items:end;
}
.field{
  display:flex;
  flex-direction:column;
  gap:5px;
}
.field label{
  font-size:11.5px;
  color:var(--ink-soft);
  font-weight:500;
}
select, input[type=text], input[type=date], textarea{
  font-family:'IBM Plex Sans',sans-serif;
  font-size:13px;
  padding:8px 10px;
  border:1px solid var(--line);
  border-radius:4px;
  background:#fff;
  color:var(--ink);
  width:100%;
}
select:focus, input:focus, textarea:focus{
  outline:2px solid var(--navy);
  outline-offset:1px;
  border-color:var(--navy);
}
.filters-actions{
  display:flex;
  gap:8px;
  margin-top:14px;
  flex-wrap:wrap;
  align-items:center;
}
.date-toggle{
  display:flex;
  border:1px solid var(--line);
  border-radius:4px;
  overflow:hidden;
}
.date-toggle button{
  border:none;
  background:#fff;
  padding:7px 12px;
  font-size:12.5px;
  color:var(--ink-soft);
}
.date-toggle button.active{
  background:var(--navy);
  color:#fff;
}
.header-btn{
  background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.35);
  color:#fff;
  padding:6px 12px;
  border-radius:4px;
  font-size:12px;
  cursor:pointer;
  white-space:nowrap;
  font-family:'IBM Plex Sans',sans-serif;
}
.header-btn:hover{background:rgba(255,255,255,0.22);}
.header-btn:disabled{opacity:0.5;cursor:default;}

/* ---- Tela de conexão com a pasta de dados ---- */
.gate-screen{
  min-height:60vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 20px;
}
.gate-card{
  max-width:520px;
  width:100%;
  padding:32px;
  text-align:center;
}
.gate-card h2{margin-bottom:10px;}
.gate-card p{color:var(--ink-soft);font-size:13.5px;margin-bottom:6px;line-height:1.6;}
.gate-card .gate-icon{font-size:40px;margin-bottom:14px;}
.gate-card .btn{margin-top:8px;}
.gate-card .gate-warning{
  background:var(--st-and-bg);color:var(--st-and-fg);
  border-radius:5px;padding:10px 14px;font-size:12.5px;margin:14px 0;text-align:left;
}
.folder-chip{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11.5px;color:rgba(255,255,255,0.85);
  background:rgba(255,255,255,0.1);padding:5px 10px;border-radius:4px;
}

.btn{
  border:1px solid var(--line);
  background:#fff;
  color:var(--ink);
  padding:8px 14px;
  border-radius:4px;
  font-size:13px;
  font-weight:500;
}
.btn:hover{border-color:var(--navy);}
.btn-primary{
  background:var(--navy);
  border-color:var(--navy);
  color:#fff;
}
.btn-primary:hover{background:var(--navy-deep);}
.btn-ochre{
  background:var(--ochre);
  border-color:var(--ochre);
  color:#fff;
}
.btn-ghost{
  background:none;
  border:none;
  color:var(--navy);
  padding:6px 8px;
  font-weight:500;
  font-size:12.5px;
}
.btn-sm{padding:5px 10px;font-size:12px;}

/* ---- Bars (mini charts) ---- */
.bars-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  margin-bottom:24px;
}
.bars-card{padding:16px 18px;}
.bar-row{
  display:grid;
  grid-template-columns:110px 1fr 34px;
  align-items:center;
  gap:8px;
  margin-bottom:7px;
  font-size:12.5px;
}
.bar-row .bar-label{color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-track{
  background:var(--line-soft);
  border-radius:3px;
  height:9px;
  overflow:hidden;
}
.bar-fill{
  height:100%;
  background:var(--navy);
  border-radius:3px;
}
.bar-row .bar-count{text-align:right;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:11.5px;}

/* ---- Table ---- */
.table-wrap{overflow-x:auto;}
table{
  width:100%;
  border-collapse:collapse;
  font-size:12.8px;
}
thead th{
  text-align:left;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:0.04em;
  color:var(--ink-soft);
  font-weight:600;
  padding:10px 12px;
  border-bottom:1px solid var(--line);
  white-space:nowrap;
}
tbody td{
  padding:10px 12px;
  border-bottom:1px solid var(--line-soft);
  vertical-align:top;
}
tbody tr:hover{background:#FAFAF8;}
.sgd-code{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--navy);}
.local-cell .place{font-weight:500;}
.local-cell .desc{color:var(--ink-soft);font-size:11.8px;display:block;margin-top:2px;max-width:280px;}
.tag-cat{
  display:inline-block;
  font-size:10.8px;
  padding:2px 7px;
  border-radius:10px;
  background:var(--ochre-soft);
  color:#7A4E12;
  margin:1px 3px 1px 0;
  white-space:nowrap;
}
.status-pill{
  display:inline-block;
  font-size:11px;
  font-weight:500;
  padding:3px 9px;
  border-radius:10px;
  white-space:nowrap;
}
.status-nao_iniciado{color:var(--st-nao-fg);background:var(--st-nao-bg);}
.status-em_andamento{color:var(--st-and-fg);background:var(--st-and-bg);}
.status-finalizado{color:var(--st-fin-fg);background:var(--st-fin-bg);}
.status-em_espera{color:var(--st-esp-fg);background:var(--st-esp-bg);}
.status-recusado{color:var(--st-rec-fg);background:var(--st-rec-bg);}

.pagination{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 18px;
  font-size:12.5px;
  color:var(--ink-soft);
}
.pagination .pg-btns{display:flex;gap:6px;}

.empty-state{
  padding:50px 20px;
  text-align:center;
  color:var(--ink-soft);
}
.empty-state h3{color:var(--ink-soft);font-size:15px;margin-bottom:6px;}

/* ---- Form ---- */
.form-card{padding:24px;max-width:720px;}
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.form-grid .full{grid-column:1/-1;}
.checkbox-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:8px;
  padding:10px 0 2px;
}
.checkbox-item{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:12.8px;
  padding:6px 8px;
  border:1px solid var(--line);
  border-radius:4px;
  background:#fff;
}
.checkbox-item input{width:auto;}
.form-actions{
  display:flex;
  gap:10px;
  margin-top:20px;
  padding-top:18px;
  border-top:1px solid var(--line-soft);
}
.hint{font-size:11.5px;color:var(--ink-soft);margin-top:3px;}
.toast{
  position:fixed;
  bottom:20px;
  right:20px;
  background:var(--navy);
  color:#fff;
  padding:11px 18px;
  border-radius:5px;
  font-size:13px;
  box-shadow:0 4px 14px rgba(0,0,0,0.18);
  opacity:0;
  transform:translateY(8px);
  transition:opacity .2s ease, transform .2s ease;
  pointer-events:none;
  z-index:200;
}
.toast.show{opacity:1;transform:translateY(0);}

/* ---- Modal ---- */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(19,42,68,0.42);
  display:none;
  align-items:flex-start;
  justify-content:center;
  padding:40px 16px;
  z-index:150;
  overflow-y:auto;
}
.modal-overlay.show{display:flex;}
.modal{
  background:#fff;
  border-radius:8px;
  max-width:600px;
  width:100%;
  padding:24px;
}
.modal h3{margin-bottom:4px;}
.modal .modal-sub{font-size:12px;color:var(--ink-soft);margin-bottom:18px;}
.modal-close{
  float:right;
  background:none;border:none;
  font-size:18px;color:var(--ink-soft);
  line-height:1;
}

@media (max-width:860px){
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .bars-grid{grid-template-columns:1fr;}
  .form-grid{grid-template-columns:1fr;}
}

@media print{
  .app-header, .filters, .tabs, .no-print, .pagination .pg-btns{display:none !important;}
  body{background:#fff;}
  .wrap{padding:0;max-width:100%;}
  .card{border:none;}
  table{font-size:11px;}
}

/* ---- Mapa ---- */
.map-layout{
  display:grid;
  grid-template-columns:320px 1fr;
  gap:16px;
  height:calc(100vh - 190px);
  min-height:520px;
}
.map-sidebar{
  overflow-y:auto;
  padding:14px;
}
.map-chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.map-chip{
  font-size:11px;font-family:'IBM Plex Mono',monospace;
  padding:5px 10px;border-radius:999px;border:1.5px solid var(--line);
  background:#fff;cursor:pointer;color:var(--ink-soft);
  display:flex;align-items:center;gap:5px;
}
.map-chip .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.map-chip.active{border-color:var(--navy);color:var(--navy);font-weight:600;}
.unit-item{
  padding:10px 10px;
  border-bottom:1px solid var(--line-soft);
  cursor:pointer;
  font-size:12.5px;
}
.unit-item:hover{background:#FAFAF8;}
.unit-item .u-name{font-weight:500;}
.unit-item .u-meta{color:var(--ink-soft);font-size:11px;margin-top:2px;}
.unit-item .u-count{
  display:inline-block;margin-top:4px;
  font-size:10.5px;font-family:'IBM Plex Mono',monospace;
  padding:2px 7px;border-radius:9px;background:var(--ochre-soft);color:#7A4E12;
}
#leaflet-map{
  height:100%;
  border-radius:6px;
  border:1px solid var(--line);
}
.leaflet-popup-content{font-family:'IBM Plex Sans',sans-serif;font-size:12.8px;min-width:200px;}
.leaflet-popup-content .pop-title{font-weight:600;font-family:'Space Grotesk',sans-serif;margin-bottom:3px;}
.leaflet-popup-content .pop-addr{color:var(--ink-soft);font-size:11.5px;margin-bottom:6px;}
.leaflet-popup-content .pop-link{color:var(--navy);font-weight:500;font-size:12px;cursor:pointer;text-decoration:underline;}

/* ---- Relatório Fotográfico ---- */
.foto-search-result{
  border:1px solid var(--line);
  border-radius:5px;
  padding:10px 12px;
  margin-bottom:6px;
  cursor:pointer;
  font-size:12.8px;
}
.foto-search-result:hover{border-color:var(--navy);}
.foto-selected-card{
  padding:18px 20px;
  margin-bottom:20px;
}
.foto-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:14px;
  margin:16px 0;
}
.foto-item{
  border:1px solid var(--line);
  border-radius:6px;
  overflow:hidden;
  background:#fff;
}
.foto-item img{width:100%;height:130px;object-fit:cover;display:block;}
.foto-item .foto-meta{padding:8px;}
.foto-item select, .foto-item input{font-size:11.5px;padding:5px 6px;margin-bottom:5px;}
.foto-item .foto-remove{
  font-size:11px;color:var(--st-rec-fg);background:none;border:none;padding:0;
}
.upload-drop{
  border:2px dashed var(--line);
  border-radius:6px;
  padding:26px;
  text-align:center;
  color:var(--ink-soft);
  font-size:13px;
  cursor:pointer;
}
.upload-drop:hover{border-color:var(--navy);color:var(--navy);}

/* ---- Print: relatório fotográfico ---- */
#print-area-fotos{display:none;}
body.printing-fotos > *:not(#print-area-fotos){display:none !important;}
body.printing-fotos #print-area-fotos{
  display:block;
  padding:24px;
  font-family:'IBM Plex Sans',sans-serif;
  color:#1B2430;
}
.pf-header{border-bottom:2px solid #1F3A5C;padding-bottom:10px;margin-bottom:16px;}
.pf-header h1{font-size:18px;margin-bottom:4px;}
.pf-header .pf-sub{font-size:11.5px;color:#5B6472;}
.pf-info-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:6px 24px;
  font-size:12.5px;margin-bottom:18px;
}
.pf-info-grid div span{color:#5B6472;display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:0.04em;}
.pf-photos{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.pf-photo{border:1px solid #DBDFDD;border-radius:4px;overflow:hidden;break-inside:avoid;}
.pf-photo img{width:100%;display:block;max-height:340px;object-fit:cover;}
.pf-photo .pf-cap{padding:8px 10px;font-size:11.5px;}
.pf-photo .pf-cap b{display:block;font-size:10px;text-transform:uppercase;color:#96590A;letter-spacing:0.04em;margin-bottom:2px;}
</style>
</head>
<body>
<header class="app-header">
  <div class="title-row">
    <div>
      <h1>Controle de Serviços de Manutenção</h1>
      <div class="subtitle">CTOSM · Gerência de Projetos · Secretaria Municipal de Saúde de Cuiabá</div>
    </div>
    <div class="meta" style="display:flex;align-items:center;gap:8px;" id="header-actions">
      <span id="header-meta">carregando dados…</span>
      <span id="folder-status"></span>
      <button class="header-btn no-print" id="btn-export-backup">💾 Salvar cópia (.zip)</button>
      <button class="header-btn no-print" id="btn-import-backup">Importar backup</button>
      <input type="file" id="import-backup-input" accept=".zip" style="display:none;">
    </div>
  </div>
  <nav class="tabs" id="main-tabs">
    <button class="tab-btn active" data-tab="painel">Painel &amp; Relatórios</button>
    <button class="tab-btn" data-tab="cadastro">Cadastrar SGD</button>
    <button class="tab-btn" data-tab="registros">Todos os Registros</button>
    <button class="tab-btn" data-tab="fotos">Relatório Fotográfico</button>
    <button class="tab-btn" data-tab="mapa">Mapa</button>
  </nav>
</header>

<main class="wrap" id="main-wrap">
  <div id="tab-painel"></div>
  <div id="tab-cadastro" style="display:none;"></div>
  <div id="tab-registros" style="display:none;"></div>
  <div id="tab-fotos" style="display:none;"></div>
  <div id="tab-mapa" style="display:none;"></div>
  <div id="gate-screen" style="display:none;"></div>
</main>

<div id="print-area-fotos"></div>

<div class="modal-overlay no-print" id="edit-modal-overlay">
  <div class="modal" id="edit-modal-content"></div>
</div>

function normalizeUnitName(s) {
  if (!s) return '';
  s = s.normalize('NFKD').replace(/[\u0300-\u036f]/g, '');
  s = s.toUpperCase();
  s = s.replace(/[^A-Z0-9 ]/g, ' ');
  s = s.replace(/\s+/g, ' ').trim();
  return s;
}
const UNITS_BY_NORM = {};
UNITS.forEach((u) => { UNITS_BY_NORM[normalizeUnitName(u.name)] = u; });

<script>
'use strict';

/* ============ Constantes de domínio ============ */
const CATEGORIAS = {
  eletrica: 'Elétrica',
  hidraulica: 'Hidráulica',
  pedreiro_civil: 'Pedreiro / Civil',
  pintura: 'Pintura',
  limpeza: 'Limpeza',
  serralheria: 'Serralheria',
  ar_condicionado: 'Ar-condicionado',
  outros: 'Outros',
};
const REGIONAIS = ['Norte', 'Sul', 'Leste', 'Oeste', 'Rural', 'SMS'];
const REGION_COLOR = {
  Leste: '#C1602E', Norte: '#2F7A5B', Oeste: '#3E6B9C',
  Sul: '#7C4C9C', Rural: '#B08D2A', SMS: '#5B6B6A',
};
const STATUS = {
  nao_iniciado: 'Não iniciado',
  em_andamento: 'Em andamento',
  finalizado: 'Finalizado',
  em_espera: 'Em espera',
  recusado: 'Recusado',
};
const PRIORIDADES = { baixa: 'Baixa', media: 'Média', alta: 'Alta' };

const STORAGE_KEY = 'servicos:registros';
const PAGE_SIZE = 25;

/* ============ Estado ============ */
let DATA = [];
let filters = {
  regional: 'all',
  categoria: 'all',
  status: 'all',
  dateField: 'solicitacao', // 'solicitacao' | 'execucao'
  dateFrom: '',
  dateTo: '',
  search: '',
};
let registrosFilters = {
  regional: 'all',
  categoria: 'all',
  status: 'all',
  search: '',
};
let currentPage = 1;
let registrosPage = 1;
let activeTab = 'painel';

/* ============ Storage: Supabase (Postgres + Storage) ============
   Todos os dados (registros, fotos, documentos) ficam no projeto Supabase
   compartilhado com o sistema de estoque (tabelas com prefixo cs_ e bucket
   "servicos-manutencao"), sem tela de login — mesmo padrão dos outros
   sistemas da CTOSM.
*/
let sb = null;

function initSupabaseClient() {
  if (!window.supabase || !window.supabase.createClient) {
    throw new Error('Biblioteca do Supabase não carregada.');
  }
  if (!window.SUPABASE_URL || !window.SUPABASE_ANON_KEY) {
    throw new Error('Configuração do Supabase ausente (supabase-config.js).');
  }
  sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
}

function publicUrl(path) {
  if (!path) return '';
  return window.SUPABASE_URL + '/storage/v1/object/public/' + window.SUPABASE_BUCKET + '/' + path;
}

async function urlToBlob(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error('Falha ao baixar arquivo: ' + res.status);
  return await res.blob();
}

function rowToRegistro(row) {
  return {
    id: row.id,
    sgd: row.sgd || '',
    descricao: row.descricao || '',
    solicitacao: row.solicitacao || '',
    local: row.local || '',
    regional: row.regional || null,
    categorias: row.categorias || [],
    categoriaOriginal: row.categoria_original || '',
    prioridade: row.prioridade || null,
    dataSolicitacao: row.data_solicitacao || null,
    dataExecucao: row.data_execucao || null,
    status: row.status || 'nao_iniciado',
    comentarios: row.comentarios || null,
    lat: row.lat != null ? row.lat : null,
    lng: row.lng != null ? row.lng : null,
  };
}

function registroToRow(r) {
  return {
    id: r.id,
    sgd: r.sgd || '',
    descricao: r.descricao || '',
    solicitacao: r.solicitacao || '',
    local: r.local || '',
    regional: r.regional || null,
    categorias: r.categorias || [],
    categoria_original: r.categoriaOriginal || '',
    prioridade: r.prioridade || null,
    data_solicitacao: r.dataSolicitacao || null,
    data_execucao: r.dataExecucao || null,
    status: r.status || 'nao_iniciado',
    comentarios: r.comentarios || null,
    lat: r.lat != null ? r.lat : null,
    lng: r.lng != null ? r.lng : null,
    updated_at: new Date().toISOString(),
  };
}

/* ============ Storage: funções usadas pelo resto do app ============ */
async function loadData() {
  const { data, error } = await sb.from('cs_registros').select('*').order('data_solicitacao', { ascending: true });
  if (error) { console.error(error); DATA = []; throw error; }
  DATA = (data || []).map(rowToRegistro);
}

async function persist() {
  try {
    const rows = DATA.map(registroToRow);
    const chunkSize = 200;
    for (let i = 0; i < rows.length; i += chunkSize) {
      const chunk = rows.slice(i, i + chunkSize);
      const { error } = await sb.from('cs_registros').upsert(chunk, { onConflict: 'id' });
      if (error) throw error;
    }
  } catch (e) {
    showToast('Erro ao salvar os dados: ' + (e && e.message ? e.message : ''), 7000);
    console.error(e);
  }
}

function showToast(msg, durationMs) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => t.classList.remove('show'), durationMs || 2600);
}

function todayISO() {
  return new Date().toISOString().slice(0, 10);
}

function fmtDateBR(iso) {
  if (!iso) return '—';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function genId() {
  return 'novo-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);
}

<script>
/* ============ Filtragem ============ */
function applyFilterSet(list, f, includeDateRange) {
  return list.filter((r) => {
    if (f.regional !== 'all') {
      if (f.regional === 'nao_informado') {
        if (r.regional) return false;
      } else if (r.regional !== f.regional) {
        return false;
      }
    }
    if (f.categoria !== 'all' && !r.categorias.includes(f.categoria)) return false;
    if (f.status !== 'all' && r.status !== f.status) return false;
    if (f.search) {
      const q = f.search.toLowerCase();
      const hay = (r.sgd + ' ' + r.local + ' ' + r.descricao + ' ' + r.solicitacao).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (includeDateRange) {
      const dateVal = f.dateField === 'solicitacao' ? r.dataSolicitacao : r.dataExecucao;
      if (f.dateFrom && (!dateVal || dateVal < f.dateFrom)) return false;
      if (f.dateTo && (!dateVal || dateVal > f.dateTo)) return false;
    }
    return true;
  });
}

function getFilteredPainel() {
  return applyFilterSet(DATA, filters, true);
}
function getFilteredRegistros() {
  return applyFilterSet(DATA, registrosFilters, false);
}

function countBy(list, keyFn) {
  const map = {};
  list.forEach((r) => {
    const keys = keyFn(r);
    (Array.isArray(keys) ? keys : [keys]).forEach((k) => {
      if (k === null || k === undefined) k = 'Não informado';
      map[k] = (map[k] || 0) + 1;
    });
  });
  return map;
}

function statusPillHtml(status) {
  return `<span class="status-pill status-${status}">${STATUS[status] || status}</span>`;
}

function categoriasHtml(cats) {
  return cats.map((c) => `<span class="tag-cat">${CATEGORIAS[c] || c}</span>`).join('');
}

function optionsHtml(map, selected, includeAll, allLabel) {
  let html = '';
  if (includeAll) html += `<option value="all" ${selected === 'all' ? 'selected' : ''}>${allLabel}</option>`;
  Object.keys(map).forEach((k) => {
    html += `<option value="${k}" ${selected === k ? 'selected' : ''}>${map[k]}</option>`;
  });
  return html;
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
</script>

    .sort((a, b) => b[1] - a[1])
    .map(
      ([key, count]) => `
      <div class="bar-row">
        <div class="bar-label">${CATEGORIAS[key] || key}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(count / maxCategoria) * 100}%; background:var(--ochre);"></div></div>

  const tableRows = pageItems.length
    ? pageItems
        .map(
          (r) => `
      <tr>
        <td class="sgd-code">${escapeHtml(r.sgd)}</td>
        <td class="local-cell">
          <span class="place">${escapeHtml(r.local)}</span>
          <span class="desc">${escapeHtml(r.solicitacao)}</span>
        </td>
        <td>${r.regional || '—'}</td>
        <td>${categoriasHtml(r.categorias)}</td>
        <td>${statusPillHtml(r.status)}</td>
        <td class="mono">${fmtDateBR(r.dataSolicitacao)}</td>

      <div class="card kpi nao"><div class="num">${kpiCounts.nao_iniciado}</div><div class="label">Não iniciado</div></div>
      <div class="card kpi and"><div class="num">${kpiCounts.em_andamento}</div><div class="label">Em andamento</div></div>
      <div class="card kpi fin"><div class="num">${kpiCounts.finalizado}</div><div class="label">Finalizado</div></div>

            <option value="nao_informado" ${filters.regional === 'nao_informado' ? 'selected' : ''}>Não informado</option>
          </select>
        </div>
        <div class="field">
          <label for="f-categoria">Categoria de serviço</label>
          <select id="f-categoria">${optionsHtml(CATEGORIAS, filters.categoria, true, 'Todas as categorias')}</select>
        </div>
        <div class="field">
          <label for="f-status">Status</label>
          <select id="f-status">${optionsHtml(STATUS, filters.status, true, 'Todos os status')}</select>
        </div>

          <label for="f-search">Buscar (SGD, unidade, descrição)</label>

        </div>
      </div>
      <div class="filters-actions">
        <div class="field" style="gap:5px;">
          <label>Filtrar data por</label>
          <div class="date-toggle">
            <button type="button" data-datefield="solicitacao" class="${filters.dateField === 'solicitacao' ? 'active' : ''}">Solicitação</button>
            <button type="button" data-datefield="execucao" class="${filters.dateField === 'execucao' ? 'active' : ''}">Execução</button>
          </div>

        <div class="field" style="max-width:150px;">

          <input type="date" id="f-date-from" value="${filters.dateFrom}">

function bindPainelEvents() {
  document.getElementById('f-regional').onchange = (e) => { filters.regional = e.target.value; currentPage = 1; renderPainel(); };
  document.getElementById('f-categoria').onchange = (e) => { filters.categoria = e.target.value; currentPage = 1; renderPainel(); };
  document.getElementById('f-status').onchange = (e) => { filters.status = e.target.value; currentPage = 1; renderPainel(); };
  document.getElementById('f-search').oninput = debounce((e) => { filters.search = e.target.value; currentPage = 1; renderPainel(); }, 250);
  document.getElementById('f-date-from').onchange = (e) => { filters.dateFrom = e.target.value; currentPage = 1; renderPainel(); };
  document.getElementById('f-date-to').onchange = (e) => { filters.dateTo = e.target.value; currentPage = 1; renderPainel(); };
  document.querySelectorAll('.date-toggle button').forEach((btn) => {
    btn.onclick = () => { filters.dateField = btn.dataset.datefield; currentPage = 1; renderPainel(); };
  });
  document.getElementById('btn-clear-filters').onclick = () => {
    filters = { regional: 'all', categoria: 'all', status: 'all', dateField: 'solicitacao', dateFrom: '', dateTo: '', search: '' };
    currentPage = 1;
    renderPainel();
  };
  document.getElementById('btn-print-report').onclick = () => window.print();
  document.getElementById('btn-export-csv').onclick = () => exportCsv(getFilteredPainel());
  document.getElementById('btn-export-xlsx').onclick = () => exportExcel(getFilteredPainel());
  document.getElementById('btn-export-doc').onclick = () => exportWordListagem(getFilteredPainel());
  const prevBtn = document.getElementById('pg-prev');
  const nextBtn = document.getElementById('pg-next');
  if (prevBtn) prevBtn.onclick = () => { currentPage--; renderPainel(); };
  if (nextBtn) nextBtn.onclick = () => { currentPage++; renderPainel(); };
}

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

function exportCsv(list) {
  const header = ['SGD', 'Local', 'Regional', 'Categorias', 'Status', 'Data Solicitacao', 'Data Execucao', 'Solicitacao', 'Descricao', 'Comentarios'];
  const rows = list.map((r) => [
    r.sgd, r.local, r.regional || '', r.categorias.map((c) => CATEGORIAS[c]).join(' + '),
    STATUS[r.status], r.dataSolicitacao || '', r.dataExecucao || '', r.solicitacao, r.descricao, r.comentarios || '',
  ]);
  const csvContent = [header, ...rows]
    .map((row) => row.map((cell) => `"${String(cell).replace(/"/g, '""')}"`).join(';'))
    .join('\n');
  const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `relatorio-servicos-${todayISO()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function registrosToRows(list) {
  const header = ['SGD', 'Local', 'Regional', 'Categorias', 'Status', 'Data Solicitacao', 'Data Execucao', 'Solicitacao', 'Descricao', 'Comentarios'];
  const rows = list.map((r) => [
    r.sgd, r.local, r.regional || '', r.categorias.map((c) => CATEGORIAS[c]).join(' + '),
    STATUS[r.status], r.dataSolicitacao || '', r.dataExecucao || '', r.solicitacao, r.descricao || '', r.comentarios || '',
  ]);
  return [header, ...rows];
}

function exportExcel(list) {
  if (typeof XLSX === 'undefined') {
    showToast('Não foi possível gerar o Excel: biblioteca não carregou. Verifique sua conexão.');
    return;
  }
  const rows = registrosToRows(list);
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{ wch: 22 }, { wch: 30 }, { wch: 10 }, { wch: 22 }, { wch: 14 }, { wch: 14 }, { wch: 14 }, { wch: 40 }, { wch: 40 }, { wch: 30 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Registros');
  XLSX.writeFile(wb, `relatorio-servicos-${todayISO()}.xlsx`);
}

function downloadWordDoc(htmlBody, filename, title) {
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">

  <style>
    body{font-family:Calibri,Arial,sans-serif;font-size:11pt;color:#1B2430;}
    h1{font-size:16pt;color:#1F3A5C;margin-bottom:2px;}
    .sub{color:#5B6472;font-size:9pt;margin-bottom:14px;}
    table{border-collapse:collapse;width:100%;}
    th,td{border:1px solid #B9C0C6;padding:5px 7px;font-size:9.5pt;text-align:left;vertical-align:top;}
    th{background:#1F3A5C;color:#fff;}
    .info-grid{width:100%;margin-bottom:14px;}

    .foto-block{margin-bottom:16px;}
    .foto-block img{max-width:420px;display:block;margin-bottom:4px;border:1px solid #B9C0C6;}
    .foto-cap{font-size:9.5pt;color:#333;}
    .foto-cap b{color:#96590A;text-transform:uppercase;font-size:8.5pt;}
  </style></head>
  <body>${htmlBody}</body></html>`;
  const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function exportWordListagem(list) {
  const rows = registrosToRows(list);
  const header = rows[0];
  const body = rows.slice(1);
  const tableHtml = `
    <table>
      <thead><tr>${header.map((h) => `<th>${escapeHtml(h)}</th>`).join('')}</tr></thead>
      <tbody>${body.map((row) => `<tr>${row.map((c) => `<td>${escapeHtml(String(c))}</td>`).join('')}</tr>`).join('')}</tbody>
    </table>`;
  const html = `
    <h1>Relatório de Serviços de Manutenção</h1>
    <div class="sub">CTOSM · Gerência de Projetos · Secretaria Municipal de Saúde de Cuiabá — gerado em ${fmtDateBR(todayISO())} — ${list.length} registro(s)</div>
    ${tableHtml}`;
  downloadWordDoc(html, `relatorio-servicos-${todayISO()}.doc`, 'Relatório de Serviços');
}

            <label for="c-local">Unidade / Local *</label>
            <input type="text" id="c-local" list="c-local-datalist" placeholder="ex: USF Coxipó III" required autocomplete="off">
            <datalist id="c-local-datalist">
              ${UNITS.map((u) => `<option value="${escapeHtml(u.name)}">`).join('')}
            </datalist>
            <div class="hint" id="c-local-hint"></div>
          </div>
          <div class="field">
            <label for="c-regional">Regional</label>
            <select id="c-regional">
              <option value="">Não informado</option>
              ${REGIONAIS.map((r) => `<option value="${r}">${r}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label for="c-prioridade">Prioridade</label>
            <select id="c-prioridade">
              <option value="">Não definida</option>
              ${Object.entries(PRIORIDADES).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label for="c-data-solic">Data da solicitação</label>
            <input type="date" id="c-data-solic" value="${todayISO()}">
          </div>
          <div class="field full">
            <label>Categoria(s) de serviço *</label>
            <div class="checkbox-grid" id="c-categorias">
              ${Object.entries(CATEGORIAS)
                .map(
                  ([k, v]) => `
                <label class="checkbox-item"><input type="checkbox" value="${k}"> ${v}</label>`
                )
                .join('')}
            </div>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Cadastrar SGD</button>
          <button type="reset" class="btn">Limpar</button>
        </div>
      </form>
    </div>
  `;

  let matchedUnit = null;
  document.getElementById('c-local').addEventListener('input', (e) => {
    const unit = findUnitByExactName(e.target.value);
    const hint = document.getElementById('c-local-hint');
    matchedUnit = unit;
    if (unit) {
      document.getElementById('c-regional').value = unit.regional;
      hint.textContent = `Regional preenchida automaticamente: ${unit.regional} (${unit.rede})`;
    } else {
      hint.textContent = '';
    }
  });

  document.getElementById('form-novo-sgd').onsubmit = async (e) => {
    e.preventDefault();
    const sgd = document.getElementById('c-sgd').value.trim();
    const solicitacao = document.getElementById('c-solicitacao').value.trim();
    const local = document.getElementById('c-local').value.trim();
    const categoriasSelecionadas = Array.from(document.querySelectorAll('#c-categorias input:checked')).map((i) => i.value);

    if (!sgd || !solicitacao || !local) {
      showToast('Preencha os campos obrigatórios (*).');
      return;
    }
    if (!categoriasSelecionadas.length) {
      showToast('Selecione ao menos uma categoria de serviço.');
      return;
    }
    if (DATA.some((r) => r.sgd === sgd)) {
      showToast('Já existe um registro com esse número de SGD.');
      return;
    }

    const novo = {
      id: genId(),
      sgd,
      descricao: document.getElementById('c-descricao').value.trim(),
      solicitacao,
      local,
      regional: document.getElementById('c-regional').value || null,
      categorias: categoriasSelecionadas,
      categoriaOriginal: null,
      prioridade: document.getElementById('c-prioridade').value || null,
      dataSolicitacao: document.getElementById('c-data-solic').value || null,
      dataExecucao: null,
      status: 'nao_iniciado',
      comentarios: null,
      lat: matchedUnit ? matchedUnit.lat : null,
      lng: matchedUnit ? matchedUnit.lng : null,
    };

    DATA.unshift(novo);
    await persist();
    showToast(`SGD ${sgd} cadastrado com sucesso.`);
    updateHeaderMeta();
    e.target.reset();
    document.getElementById('c-data-solic').value = todayISO();
    document.getElementById('c-local-hint').textContent = '';
    matchedUnit = null;
  };
}
</script>
<script>
function renderRegistros() {
  const el = document.getElementById('tab-registros');
  const filtered = getFilteredRegistros();

  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  if (registrosPage > totalPages) registrosPage = totalPages;
  const pageItems = filtered.slice((registrosPage - 1) * PAGE_SIZE, registrosPage * PAGE_SIZE);

  const rows = pageItems.length
    ? pageItems
        .map(
          (r) => `
      <tr>
        <td class="sgd-code">${escapeHtml(r.sgd)}</td>
        <td class="local-cell">
          <span class="place">${escapeHtml(r.local)}</span>
          <span class="desc">${escapeHtml(r.solicitacao)}</span>
        </td>
        <td>${r.regional || '—'}</td>
        <td>${categoriasHtml(r.categorias)}</td>
        <td>${statusPillHtml(r.status)}</td>
        <td class="mono">${fmtDateBR(r.dataSolicitacao)}</td>
        <td class="mono">${fmtDateBR(r.dataExecucao)}</td>
        <td>
          <button class="btn-ghost" data-editid="${r.id}">Editar</button>
          <button class="btn-ghost" data-baixaid="${r.id}" style="color:var(--st-fin-fg);">Dar baixa</button>
        </td>
      </tr>`
        )
        .join('')
    : '';

  el.innerHTML = `
    <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
      <span>Todos os registros (${DATA.length} no total)</span>
      <span>
        <button class="btn btn-sm no-print" id="btn-recalc-regional">Preencher regionais automaticamente</button>
        <button class="btn btn-sm no-print" id="btn-import-xlsx">Importar Excel (sincronizar)</button>
        <input type="file" id="import-xlsx-input" accept=".xlsx,.xls" style="display:none;">
      </span>
    </div>
    <div class="card filters">
      <div class="filters-grid">
        <div class="field">
          <label for="r-regional">Regional</label>
          <select id="r-regional">
            <option value="all">Todas as regionais</option>
            ${REGIONAIS.map((r) => `<option value="${r}" ${registrosFilters.regional === r ? 'selected' : ''}>${r}</option>`).join('')}
            <option value="nao_informado" ${registrosFilters.regional === 'nao_informado' ? 'selected' : ''}>Não informado</option>
          </select>
        </div>
        <div class="field">
          <label for="r-categoria">Categoria</label>
          <select id="r-categoria">${optionsHtml(CATEGORIAS, registrosFilters.categoria, true, 'Todas as categorias')}</select>
        </div>
        <div class="field">
          <label for="r-status">Status</label>
          <select id="r-status">${optionsHtml(STATUS, registrosFilters.status, true, 'Todos os status')}</select>
        </div>
        <div class="field">
          <label for="r-search">Buscar</label>
          <input type="text" id="r-search" value="${escapeHtml(registrosFilters.search)}" placeholder="SGD, unidade, descrição...">
        </div>
      </div>
    </div>

    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>SGD</th><th>Unidade / Solicitação</th><th>Regional</th><th>Categoria(s)</th><th>Status</th><th>Solicitado em</th><th>Executado em</th><th>Ações</th></tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
        ${!pageItems.length ? '<div class="empty-state"><h3>Nenhum registro encontrado</h3><p>Ajuste os filtros acima ou cadastre um novo SGD.</p></div>' : ''}
      </div>
      <div class="pagination">
        <span>Página ${registrosPage} de ${totalPages}</span>
        <div class="pg-btns">
          <button class="btn btn-sm" id="rpg-prev" ${registrosPage <= 1 ? 'disabled' : ''}>Anterior</button>
          <button class="btn btn-sm" id="rpg-next" ${registrosPage >= totalPages ? 'disabled' : ''}>Próxima</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('r-regional').onchange = (e) => { registrosFilters.regional = e.target.value; registrosPage = 1; renderRegistros(); };
  document.getElementById('r-categoria').onchange = (e) => { registrosFilters.categoria = e.target.value; registrosPage = 1; renderRegistros(); };
  document.getElementById('r-status').onchange = (e) => { registrosFilters.status = e.target.value; registrosPage = 1; renderRegistros(); };
  document.getElementById('r-search').oninput = debounce((e) => { registrosFilters.search = e.target.value; registrosPage = 1; renderRegistros(); }, 250);
  const rprev = document.getElementById('rpg-prev');
  const rnext = document.getElementById('rpg-next');
  if (rprev) rprev.onclick = () => { registrosPage--; renderRegistros(); };
  if (rnext) rnext.onclick = () => { registrosPage++; renderRegistros(); };
  document.querySelectorAll('[data-editid]').forEach((btn) => {
    btn.onclick = () => openEditModal(btn.dataset.editid);
  });
  document.querySelectorAll('[data-baixaid]').forEach((btn) => {
    btn.onclick = () => openBaixaModal(btn.dataset.baixaid);
  });
  const recalcBtn = document.getElementById('btn-recalc-regional');
  if (recalcBtn) recalcBtn.onclick = recalcularRegionais;
  const importXlsxBtn = document.getElementById('btn-import-xlsx');
  if (importXlsxBtn) importXlsxBtn.onclick = () => document.getElementById('import-xlsx-input').click();
  const importXlsxInput = document.getElementById('import-xlsx-input');
  if (importXlsxInput) {
    importXlsxInput.onchange = (e) => {
      const file = e.target.files[0];
      if (file) importarExcel(file);
      e.target.value = '';
    };
  }
}

const STATUS_LABEL_TO_KEY = Object.fromEntries(Object.entries(STATUS).map(([k, v]) => [v.toUpperCase(), k]));
const CATEGORIA_LABEL_TO_KEY = Object.fromEntries(Object.entries(CATEGORIAS).map(([k, v]) => [v.toUpperCase(), k]));

function parseExcelDate(val) {
  if (!val) return null;
  if (typeof val === 'string') {
    // aceita "27/01/2026" ou "2026-01-27"
    const br = val.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    if (br) return `${br[3]}-${br[2]}-${br[1]}`;
    const iso = val.match(/^\d{4}-\d{2}-\d{2}$/);
    if (iso) return val;
    return null;
  }
  if (typeof val === 'number' && typeof XLSX !== 'undefined') {
    const d = XLSX.SSF.parse_date_code(val);
    if (!d) return null;
    return `${d.y}-${String(d.m).padStart(2, '0')}-${String(d.d).padStart(2, '0')}`;
  }
  return null;
}

async function importarExcel(file) {
  if (typeof XLSX === 'undefined') {
    showToast('Não foi possível importar: biblioteca de planilhas não carregou.');
    return;
  }
  try {
    const buffer = await file.arrayBuffer();
    const wb = XLSX.read(buffer, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
    if (!rows.length) throw new Error('Planilha vazia.');

    const header = rows[0].map((h) => String(h).trim().toLowerCase());
    const idx = {
      sgd: header.indexOf('sgd'),
      local: header.indexOf('local'),
      regional: header.indexOf('regional'),
      categorias: header.indexOf('categorias'),
      status: header.indexOf('status'),
      dataSolic: header.findIndex((h) => h.includes('solicitacao') && h.includes('data')),
      dataExec: header.findIndex((h) => h.includes('execucao') && h.includes('data')),
      solicitacao: header.indexOf('solicitacao'),
      descricao: header.indexOf('descricao'),
      comentarios: header.indexOf('comentarios'),
    };
    if (idx.sgd === -1) throw new Error('Coluna "SGD" não encontrada. Use o arquivo exportado pelo próprio sistema.');

    const bySgd = {};
    DATA.forEach((r) => { bySgd[r.sgd.trim()] = r; });

    let atualizados = 0;
    const naoEncontrados = [];

    for (let i = 1; i < rows.length; i++) {
      const row = rows[i];
      const sgd = String(row[idx.sgd] || '').trim();
      if (!sgd) continue;
      const existing = bySgd[sgd];
      if (!existing) { naoEncontrados.push(sgd); continue; }

      if (idx.local !== -1 && row[idx.local]) existing.local = String(row[idx.local]).trim();
      if (idx.regional !== -1) existing.regional = row[idx.regional] ? String(row[idx.regional]).trim() : null;
      if (idx.categorias !== -1 && row[idx.categorias]) {
        const labels = String(row[idx.categorias]).split('+').map((s) => s.trim().toUpperCase());
        const cats = labels.map((l) => CATEGORIA_LABEL_TO_KEY[l]).filter(Boolean);
        existing.categorias = cats.length ? cats : existing.categorias;
      }
      if (idx.status !== -1 && row[idx.status]) {
        const key = STATUS_LABEL_TO_KEY[String(row[idx.status]).trim().toUpperCase()];
        if (key) existing.status = key;
      }
      if (idx.dataSolic !== -1) existing.dataSolicitacao = parseExcelDate(row[idx.dataSolic]) || existing.dataSolicitacao;
      if (idx.dataExec !== -1) existing.dataExecucao = parseExcelDate(row[idx.dataExec]);
      if (idx.solicitacao !== -1 && row[idx.solicitacao]) existing.solicitacao = String(row[idx.solicitacao]).trim();
      if (idx.descricao !== -1) existing.descricao = row[idx.descricao] ? String(row[idx.descricao]).trim() : existing.descricao;
      if (idx.comentarios !== -1) existing.comentarios = row[idx.comentarios] ? String(row[idx.comentarios]).trim() : null;

      atualizados++;
    }

    await persist();
    updateHeaderMeta();
    renderRegistros();

    let msg = `${atualizados} registro(s) atualizado(s) a partir do Excel.`;
    if (naoEncontrados.length) {
      msg += ` ${naoEncontrados.length} SGD(s) não encontrados e ignorados (ex: ${naoEncontrados.slice(0, 3).join(', ')}).`;
    }
    showToast(msg);
  } catch (err) {
    console.error(err);
    showToast('Erro ao importar Excel: ' + (err && err.message ? err.message : 'arquivo inválido.'));
  }
}

async function recalcularRegionais() {
  let updated = 0;
  DATA.forEach((r) => {
    if (!r.regional) {
      const unit = findUnitByExactName(r.local);
      if (unit) {
        r.regional = unit.regional;
        r.lat = unit.lat;
        r.lng = unit.lng;
        updated++;
      }
    } else if (r.lat == null) {
      const unit = findUnitByExactName(r.local);
      if (unit) { r.lat = unit.lat; r.lng = unit.lng; }
    }
  });
  if (updated > 0) {
    await persist();
    showToast(`${updated} registro(s) atualizados com a regional correspondente.`);
  } else {
    showToast('Nenhum registro novo para atualizar — os locais restantes não têm correspondência exata na lista de unidades.');
  }
  renderRegistros();
}

/* ============ Modal de edição ============ */
function openEditModal(id) {
  const r = DATA.find((x) => x.id === id);
  if (!r) return;
  const overlay = document.getElementById('edit-modal-overlay');
  const content = document.getElementById('edit-modal-content');

  content.innerHTML = `
    <button class="modal-close" id="modal-close-btn">&times;</button>
    <h3 class="mono">${escapeHtml(r.sgd)}</h3>
    <div class="modal-sub">${escapeHtml(r.local)} — ${escapeHtml(r.solicitacao)}</div>
    <div class="form-grid">
      <div class="field">
        <label for="e-status">Status</label>
        <select id="e-status">${optionsHtml(STATUS, r.status, false, '')}</select>
      </div>
      <div class="field">
        <label for="e-prioridade">Prioridade</label>
        <select id="e-prioridade">
          <option value="" ${!r.prioridade ? 'selected' : ''}>Não definida</option>
          ${Object.entries(PRIORIDADES).map(([k, v]) => `<option value="${k}" ${r.prioridade === k ? 'selected' : ''}>${v}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label for="e-data-solic">Data da solicitação</label>
        <input type="date" id="e-data-solic" value="${r.dataSolicitacao || ''}">
      </div>
      <div class="field">
        <label for="e-data-exec">Data de execução</label>
        <input type="date" id="e-data-exec" value="${r.dataExecucao || ''}">
      </div>
      <div class="field full">
        <label>Categoria(s) de serviço</label>
        <div class="checkbox-grid">
          ${Object.entries(CATEGORIAS)
            .map(
              ([k, v]) => `
            <label class="checkbox-item"><input type="checkbox" value="${k}" ${r.categorias.includes(k) ? 'checked' : ''}> ${v}</label>`
            )
            .join('')}
        </div>
      </div>
      <div class="field full">
        <label for="e-comentarios">Comentários</label>
        <textarea id="e-comentarios" rows="3">${escapeHtml(r.comentarios || '')}</textarea>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" id="e-save">Salvar alterações</button>
      <button class="btn" id="e-cancel">Cancelar</button>
    </div>
  `;

  overlay.classList.add('show');
  document.getElementById('modal-close-btn').onclick = closeEditModal;
  document.getElementById('e-cancel').onclick = closeEditModal;
  document.getElementById('e-save').onclick = async () => {
    r.status = document.getElementById('e-status').value;
    r.prioridade = document.getElementById('e-prioridade').value || null;
    r.dataSolicitacao = document.getElementById('e-data-solic').value || null;
    r.dataExecucao = document.getElementById('e-data-exec').value || null;
    r.comentarios = document.getElementById('e-comentarios').value.trim() || null;
    const cats = Array.from(content.querySelectorAll('.checkbox-grid input:checked')).map((i) => i.value);
    r.categorias = cats.length ? cats : ['outros'];
    await persist();
    closeEditModal();
    showToast(`SGD ${r.sgd} atualizado.`);
    updateHeaderMeta();
    if (activeTab === 'painel') renderPainel();
    if (activeTab === 'registros') renderRegistros();
  };
}

function closeEditModal() {
  document.getElementById('edit-modal-overlay').classList.remove('show');
}
</script>
<script>
/* ============ Mapa ============ */
let leafletMap = null;
let mapActiveRegion = 'Todos';
const MAP_REGIONS = ['Todos', 'Leste', 'Norte', 'Oeste', 'Sul', 'Rural', 'SMS'];

function countOpenByUnitName(unitName) {
  const normTarget = normalizeUnitName(unitName);
  return DATA.filter((r) => {
    if (r.status === 'finalizado' || r.status === 'recusado') return false;
    return normalizeUnitName(r.local) === normTarget;
  }).length;
}

function recordsForUnitName(unitName) {
  const normTarget = normalizeUnitName(unitName);
  return DATA.filter((r) => normalizeUnitName(r.local) === normTarget);
}

function renderMapa() {
  const el = document.getElementById('tab-mapa');
  el.innerHTML = `
    <div class="section-title">Mapa das unidades de saúde</div>
    <div class="map-layout card">
      <div class="map-sidebar">
        <input type="text" id="map-search" placeholder="Buscar unidade..." style="margin-bottom:10px;">
        <div class="map-chip-row" id="map-chips"></div>
        <div id="map-unit-list"></div>
      </div>
      <div id="leaflet-map"></div>
    </div>
  `;

  MAP_REGIONS.forEach((r) => {
    const chip = document.createElement('div');
    chip.className = 'map-chip' + (mapActiveRegion === r ? ' active' : '');
    const color = r === 'Todos' ? '#1F3A5C' : (REGION_COLOR[r] || '#5B6B6A');
    chip.innerHTML = `<span class="dot" style="background:${color}"></span>${r}`;
    chip.onclick = () => { mapActiveRegion = r; renderMapa(); };
    document.getElementById('map-chips').appendChild(chip);
  });

  document.getElementById('map-search').oninput = debounce(() => renderMapUnitList(), 200);

  renderMapUnitList();
  if (typeof L === 'undefined') {
    document.getElementById('leaflet-map').innerHTML =
      '<div class="empty-state"><h3>Não foi possível carregar o mapa</h3><p>Verifique sua conexão com a internet e recarregue a página.</p></div>';
    return;
  }
  initLeafletMap();
}

function renderMapUnitList() {
  const q = (document.getElementById('map-search').value || '').toLowerCase();
  const listEl = document.getElementById('map-unit-list');
  const filtered = UNITS.filter((u) => {
    const okRegion = mapActiveRegion === 'Todos' || u.regional === mapActiveRegion;
    const okSearch = !q || u.name.toLowerCase().includes(q) || u.endereco.toLowerCase().includes(q);
    return okRegion && okSearch;
  });
  listEl.innerHTML = filtered
    .map((u) => {
      const count = countOpenByUnitName(u.name);
      return `<div class="unit-item" data-unit="${escapeHtml(u.name)}">
        <div class="u-name">${escapeHtml(u.name)}</div>
        <div class="u-meta">${u.regional} · ${u.rede}</div>
        ${count > 0 ? `<span class="u-count">${count} SGD(s) em aberto</span>` : ''}
      </div>`;
    })
    .join('');
  listEl.querySelectorAll('[data-unit]').forEach((item) => {
    item.onclick = () => {
      const unit = UNITS.find((u) => u.name === item.dataset.unit);
      if (unit && leafletMap) {
        leafletMap.setView([unit.lat, unit.lng], 16);
        openUnitPopup(unit);
      }
    };
  });
}

let mapMarkers = [];
function initLeafletMap() {
  if (leafletMap) { leafletMap.remove(); leafletMap = null; }
  leafletMap = L.map('leaflet-map', { zoomControl: true }).setView([-15.601, -56.097], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19,
  }).addTo(leafletMap);

  mapMarkers = [];
  UNITS.forEach((u) => {
    if (mapActiveRegion !== 'Todos' && u.regional !== mapActiveRegion) return;
    const count = countOpenByUnitName(u.name);
    const color = REGION_COLOR[u.regional] || '#5B6B6A';
    const radius = count > 0 ? Math.min(8 + count * 2, 22) : 6;
    const marker = L.circleMarker([u.lat, u.lng], {
      radius,
      color: '#fff',
      weight: 1.5,
      fillColor: count > 0 ? '#B5761E' : color,
      fillOpacity: 0.85,
    }).addTo(leafletMap);
    marker.on('click', () => openUnitPopup(u));
    mapMarkers.push(marker);
  });
}

function openUnitPopup(unit) {
  const recs = recordsForUnitName(unit.name);
  const openCount = recs.filter((r) => r.status !== 'finalizado' && r.status !== 'recusado').length;
  const html = `
    <div class="pop-title">${escapeHtml(unit.name)}</div>
    <div class="pop-addr">${escapeHtml(unit.endereco)}</div>
    <div style="font-size:11.5px;margin-bottom:4px;">${unit.regional} · ${unit.rede}</div>
    <div style="font-size:12px;margin-bottom:6px;">${recs.length} SGD(s) registrados — ${openCount} em aberto</div>
    ${recs.length ? `<span class="pop-link" id="pop-view-records">Ver registros desta unidade</span>` : ''}
  `;
  L.popup().setLatLng([unit.lat, unit.lng]).setContent(html).openOn(leafletMap);
  setTimeout(() => {
    const link = document.getElementById('pop-view-records');

function resizeImageFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 1280;
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round((height * maxDim) / width); width = maxDim; }
          else { width = Math.round((width * maxDim) / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handleFotoFiles(fileList) {
  const files = Array.from(fileList || []);
  for (const file of files) {

async function exportFotoPDF() {
  const r = fotosSelectedRecord;
  if (!r) return;
  if (typeof window.jspdf === 'undefined' || typeof html2canvas === 'undefined') {
    showToast('Não foi possível gerar o PDF: bibliotecas não carregaram. Verifique sua conexão.');
    return;
  }
  const btn = document.getElementById('btn-export-foto-pdf');
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Gerando PDF...';
  const container = document.createElement('div');
  container.style.position = 'fixed';
  container.style.left = '-9999px';
  container.style.top = '0';
  container.style.width = '780px';
  container.style.background = '#fff';
  container.style.padding = '24px';
  container.className = 'pf-pdf-render';
  container.innerHTML = buildFotoReportInnerHtml(r, fotosCurrentPhotos);
  document.body.appendChild(container);
  try {
    const canvas = await html2canvas(container, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
    const imgData = canvas.toDataURL('image/jpeg', 0.92);
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'pt', 'a4');
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const imgWidth = pageWidth;
    const imgHeight = (canvas.height * imgWidth) / canvas.width;
    let heightLeft = imgHeight;
    let position = 0;
    pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
    while (heightLeft > 0) {
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }
    pdf.save(`relatorio-fotografico-${sanitizeName(r.sgd)}.pdf`);
  } catch (err) {
    console.error(err);
    showToast('Erro ao gerar PDF: ' + (err && err.message ? err.message : 'tente novamente.'));
  } finally {
    document.body.removeChild(container);
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
}

<script>
/* ============ Helpers compartilhados: fotos e documento por registro (Supabase) ============ */
async function loadPhotosForRecord(id) {
  try {
    const { data, error } = await sb.from('cs_fotos').select('*').eq('registro_id', id).order('ordem', { ascending: true });
    if (error) throw error;
    return (data || []).map((r) => ({
      dataUrl: publicUrl(r.storage_path),
      caption: r.caption || '',
      tipo: r.tipo || 'depois',
      storagePath: r.storage_path,
      dbId: r.id,
    }));
  } catch (e) {
    console.error(e);
    return [];
  }
}

async function savePhotosForRecord(id, photos) {
  try {
    const { data: existingRows, error: selErr } = await sb.from('cs_fotos').select('id, storage_path').eq('registro_id', id);
    if (selErr) throw selErr;
    const keepPaths = new Set(photos.filter((p) => p.storagePath).map((p) => p.storagePath));
    const toDelete = (existingRows || []).filter((r) => !keepPaths.has(r.storage_path));
    if (toDelete.length) {
      await sb.from('cs_fotos').delete().in('id', toDelete.map((r) => r.id));
      await sb.storage.from(window.SUPABASE_BUCKET).remove(toDelete.map((r) => r.storage_path));
    }
    for (let i = 0; i < photos.length; i++) {
      const p = photos[i];
      if (!p.storagePath) {
        const blob = dataURLToBlob(p.dataUrl);
        const path = 'fotos/' + id + '/' + genId() + '.jpg';
        const { error: upErr } = await sb.storage.from(window.SUPABASE_BUCKET).upload(path, blob, { contentType: 'image/jpeg' });
        if (upErr) throw upErr;
        const { data: row, error: insErr } = await sb
          .from('cs_fotos')
          .insert({ registro_id: id, storage_path: path, caption: p.caption || '', tipo: p.tipo || 'depois', ordem: i })
          .select()
          .single();
        if (insErr) throw insErr;
        p.storagePath = path;
        p.dbId = row.id;
      } else {
        await sb.from('cs_fotos').update({ caption: p.caption || '', tipo: p.tipo || 'depois', ordem: i }).eq('registro_id', id).eq('storage_path', p.storagePath);
      }
    }
    return true;
  } catch (e) {
    console.error(e);
    showToast('Erro ao salvar fotos: ' + (e && e.message ? e.message : ''));
    return false;
  }
}

async function loadDocForRecord(id) {
  try {
    const { data, error } = await sb.from('cs_documentos').select('*').eq('registro_id', id).maybeSingle();
    if (error) throw error;
    if (!data) return null;
    return { name: data.file_name || 'documento.pdf', dataUrl: publicUrl(data.storage_path), storagePath: data.storage_path };
  } catch (e) {
    console.error(e);
    return null;
  }
}

async function saveDocForRecord(id, doc) {
  try {
    const { data: existing } = await sb.from('cs_documentos').select('storage_path').eq('registro_id', id).maybeSingle();
    if (doc) {
      if (doc.dataUrl && doc.dataUrl.indexOf('data:') === 0) {
        const blob = dataURLToBlob(doc.dataUrl);
        const path = 'documentos/' + id + '/' + genId() + '-' + sanitizeName(doc.name) + '.pdf';
        const { error: upErr } = await sb.storage.from(window.SUPABASE_BUCKET).upload(path, blob, { contentType: 'application/pdf' });
        if (upErr) throw upErr;
        const { error: upsertErr } = await sb
          .from('cs_documentos')
          .upsert({ registro_id: id, storage_path: path, file_name: doc.name, uploaded_at: new Date().toISOString() }, { onConflict: 'registro_id' });
        if (upsertErr) throw upsertErr;
        if (existing && existing.storage_path && existing.storage_path !== path) {
          await sb.storage.from(window.SUPABASE_BUCKET).remove([existing.storage_path]);
        }
      }
      return true;
    } else {
      await sb.from('cs_documentos').delete().eq('registro_id', id);
      if (existing && existing.storage_path) {
        await sb.storage.from(window.SUPABASE_BUCKET).remove([existing.storage_path]);
      }
      return true;
    }
  } catch (e) {
    console.error(e);
    showToast('Erro ao salvar o documento: ' + (e && e.message ? e.message : ''));
    return false;
  }
}
function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (ev) => resolve(ev.target.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* Renders a small "attach one PDF" widget into #<containerId>.
   doc: {name, dataUrl, size} | null. onChange(newDocOrNull) is called after add/remove. */
function renderDocArea(containerId, doc, onChange) {
  const el = document.getElementById(containerId);
  if (!el) return;
  if (doc) {
    el.innerHTML = `
      <div class="card" style="padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
        <div style="font-size:12.8px;">📄 <a href="${doc.dataUrl}" download="${escapeHtml(doc.name)}" style="color:var(--navy);font-weight:500;">${escapeHtml(doc.name)}</a></div>
        <button class="btn-ghost no-print" id="${containerId}-remove" style="color:var(--st-rec-fg);">Remover PDF</button>
      </div>`;
    document.getElementById(containerId + '-remove').onclick = () => onChange(null);
  } else {
    el.innerHTML = `
      <div class="upload-drop no-print" id="${containerId}-drop" style="padding:16px;">
        Clique para anexar um PDF (comprovante, laudo, medição...)
        <input type="file" id="${containerId}-input" accept="application/pdf" style="display:none;">
      </div>`;
    document.getElementById(containerId + '-drop').onclick = () => document.getElementById(containerId + '-input').click();
    document.getElementById(containerId + '-input').onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 4 * 1024 * 1024) {
        showToast('PDF muito grande (máx. ~4MB). Escolha um arquivo menor.');
        return;
      }
      const dataUrl = await readFileAsDataURL(file);
      onChange({ name: file.name, dataUrl, size: file.size });
    };
  }
}

  content.innerHTML = `

      <div class="field full">
        <label>Documento (PDF)</label>
        <div id="baixa-doc-area"></div>
      </div>
      <div class="field full">
        <label>Fotos do serviço executado</label>
        <div class="upload-drop no-print" id="baixa-upload-drop" style="margin-top:6px;">

          <input type="file" id="baixa-file-input" accept="image/*" multiple style="display:none;">

        <div class="foto-grid" id="baixa-foto-grid"></div>

      </div>

      <button class="btn btn-primary" id="b-save">Salvar baixa</button>
      <button class="btn" id="b-cancel">Cancelar</button>

  document.getElementById('baixa-close-btn').onclick = closeBaixaModal;

  document.getElementById('baixa-upload-drop').onclick = () => document.getElementById('baixa-file-input').click();
  document.getElementById('baixa-file-input').onchange = async (e) => {
    const files = Array.from(e.target.files || []);
    for (const file of files) {
      try {
        const dataUrl = await resizeImageFile(file);
        baixaPhotos.push({ dataUrl, caption: '', tipo: 'depois' });
      } catch (err) { console.error(err); }
    }
    renderBaixaFotoGrid();
  };
  renderBaixaFotoGrid();
  renderDocArea('baixa-doc-area', baixaDoc, handleBaixaDocChange);

  document.getElementById('b-save').onclick = async () => {
    const saveBtn = document.getElementById('b-save');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Salvando...';
    try {
      r.status = document.getElementById('b-status').value;
      r.dataExecucao = document.getElementById('b-data-exec').value || null;
      r.comentarios = document.getElementById('b-obs').value.trim() || null;
      await persist();
      await savePhotosForRecord(id, baixaPhotos);

      if (baixaDoc) {
        await saveDocForRecord(id, baixaDoc);
      } else if (baixaDocExisted) {
        await saveDocForRecord(id, null);
      }
      const savedPhotos = baixaPhotos.slice();
      const savedDoc = baixaDoc;
      closeBaixaModal();
      updateHeaderMeta();
      if (activeTab === 'painel') renderPainel();
      if (activeTab === 'registros') renderRegistros();
      showToast(`Baixa registrada para o SGD ${r.sgd}. Abrindo relatório fotográfico...`);
      // leva direto para a aba de relatório fotográfico, já com tudo carregado
      switchTab('fotos');
      fotosSelectedRecord = r;
      fotosCurrentPhotos = savedPhotos;
      fotosCurrentDoc = savedDoc;
      renderFotoSelectedArea();
    } catch (err) {
      console.error(err);
      showToast('Erro ao salvar a baixa: ' + (err && err.message ? err.message : 'tente novamente.'));
      saveBtn.disabled = false;
      saveBtn.textContent = 'Salvar baixa';
    }
  };
}

function handleBaixaDocChange(newDoc) {
  baixaDoc = newDoc;
  renderDocArea('baixa-doc-area', baixaDoc, handleBaixaDocChange);
}

function renderBaixaFotoGrid() {
  const grid = document.getElementById('baixa-foto-grid');
  if (!grid) return;
  grid.innerHTML = baixaPhotos
    .map(
      (p, i) => `
    <div class="foto-item">
      <img src="${p.dataUrl}" alt="Foto ${i + 1}">
      <div class="foto-meta">
        <select data-idx="${i}" class="baixa-foto-tipo">
          <option value="antes" ${p.tipo === 'antes' ? 'selected' : ''}>Antes</option>
          <option value="durante" ${p.tipo === 'durante' ? 'selected' : ''}>Durante</option>
          <option value="depois" ${p.tipo === 'depois' ? 'selected' : ''}>Depois</option>
        </select>
        <input type="text" data-idx="${i}" class="baixa-foto-legenda" placeholder="Legenda..." value="${escapeHtml(p.caption || '')}">
        <button class="foto-remove no-print" data-idx="${i}">Remover foto</button>
      </div>
    </div>`
    )
    .join('');
  grid.querySelectorAll('.baixa-foto-tipo').forEach((sel) => {
    sel.onchange = (e) => { baixaPhotos[+e.target.dataset.idx].tipo = e.target.value; };
  });
  grid.querySelectorAll('.baixa-foto-legenda').forEach((inp) => {
    inp.oninput = (e) => { baixaPhotos[+e.target.dataset.idx].caption = e.target.value; };
  });
  grid.querySelectorAll('.foto-remove').forEach((btn) => {
    btn.onclick = (e) => { baixaPhotos.splice(+e.target.dataset.idx, 1); renderBaixaFotoGrid(); };
  });
}

function closeBaixaModal() {
  document.getElementById('edit-modal-overlay').classList.remove('show');
  baixaRecordId = null;
  baixaPhotos = [];
  baixaDoc = null;
  baixaDocExisted = false;
}
</script>
<script>
/* ============ Backup: salvar tudo em pasta no computador ============ */
function sanitizeName(s) {
  return String(s || 'sem-sgd').replace(/[\/\\:*?"<>|]/g, '_').trim() || 'sem-sgd';
}

function dataURLToBlob(dataUrl) {
  const [header, base64] = dataUrl.split(',');
  const mimeMatch = header.match(/data:(.*?);base64/);
  const mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';
  const bin = atob(base64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

async function writeFileHandle(dirHandle, name, content) {
  const fileHandle = await dirHandle.getFileHandle(name, { create: true });
  const writable = await fileHandle.createWritable();
  await writable.write(content);
  await writable.close();
}

const BACKUP_FOLDER_NAME = 'Controle de Serviços de Manutenção';

async function coletarDadosParaBackup(onProgress) {
  const fotosPorRegistro = [];
  const docsPorRegistro = [];
  for (let i = 0; i < DATA.length; i++) {
    const r = DATA[i];
    const photos = await loadPhotosForRecord(r.id);
    if (photos.length) fotosPorRegistro.push({ sgd: r.sgd, photos });
    const doc = await loadDocForRecord(r.id);
    if (doc) docsPorRegistro.push({ sgd: r.sgd, doc });
    if (onProgress && i % 80 === 0) onProgress(i, DATA.length);
  }
  return { fotosPorRegistro, docsPorRegistro };
}

async function exportarParaComputador() {
  const btn = document.getElementById('btn-export-backup');
  btn.disabled = true;
  const originalLabel = btn.textContent;
  btn.textContent = 'Preparando...';
  try {
    if (window.showDirectoryPicker) {
      try {
        await exportViaFileSystemAPI();
        return;
      } catch (err) {
        if (err && err.name === 'AbortError') { return; } // usuário cancelou a escolha da pasta
        console.warn('File System Access API indisponível ou falhou, usando .zip como alternativa:', err);
      }
    }
    await exportarBackupZip();
  } finally {
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
}

async function exportViaFileSystemAPI() {
  const parentHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
  const rootHandle = await parentHandle.getDirectoryHandle(BACKUP_FOLDER_NAME, { create: true });
  showToast('Salvando dados na pasta escolhida...');
  await writeFileHandle(rootHandle, 'registros.json', JSON.stringify(DATA, null, 2));

  const { fotosPorRegistro, docsPorRegistro } = await coletarDadosParaBackup();

  if (fotosPorRegistro.length) {
    const fotosHandle = await rootHandle.getDirectoryHandle('fotos', { create: true });
    for (const item of fotosPorRegistro) {
      const folder = await fotosHandle.getDirectoryHandle(sanitizeName(item.sgd), { create: true });
      for (let i = 0; i < item.photos.length; i++) {
        const p = item.photos[i];
        await writeFileHandle(folder, `${i + 1}_${p.tipo || 'foto'}.jpg`, await urlToBlob(p.dataUrl));
      }
      await writeFileHandle(
        folder,
        'legendas.json',
        JSON.stringify(item.photos.map((p) => ({ tipo: p.tipo, legenda: p.caption })), null, 2)
      );
    }
  }
  if (docsPorRegistro.length) {
    const docsHandle = await rootHandle.getDirectoryHandle('documentos', { create: true });
    for (const item of docsPorRegistro) {
      const folder = await docsHandle.getDirectoryHandle(sanitizeName(item.sgd), { create: true });
      await writeFileHandle(folder, item.doc.name, await urlToBlob(item.doc.dataUrl));
    }
  }
  showToast(`Pasta "${BACKUP_FOLDER_NAME}" salva com sucesso no local escolhido!`);
}

async function exportarBackupZip() {
  if (typeof JSZip === 'undefined') {
    showToast('Não foi possível gerar o backup: biblioteca de compactação não carregou. Verifique sua conexão e tente novamente.');
    return;
  }
  showToast('Preparando backup, aguarde alguns segundos...');
  const zip = new JSZip();
  const root = zip.folder(BACKUP_FOLDER_NAME);
  root.file('registros.json', JSON.stringify(DATA, null, 2));

  const { fotosPorRegistro, docsPorRegistro } = await coletarDadosParaBackup();

  if (fotosPorRegistro.length) {
    const fotosRoot = root.folder('fotos');
    for (const item of fotosPorRegistro) {
      const folder = fotosRoot.folder(sanitizeName(item.sgd));
      for (let i = 0; i < item.photos.length; i++) {
        const p = item.photos[i];
        const blob = await urlToBlob(p.dataUrl);
        folder.file(`${i + 1}_${p.tipo || 'foto'}.jpg`, blob);
      }
      folder.file('legendas.json', JSON.stringify(item.photos.map((p) => ({ tipo: p.tipo, legenda: p.caption })), null, 2));
    }
  }
  if (docsPorRegistro.length) {
    const docsRoot = root.folder('documentos');
    for (const item of docsPorRegistro) {
      const folder = docsRoot.folder(sanitizeName(item.sgd));
      const blob = await urlToBlob(item.doc.dataUrl);
      folder.file(item.doc.name, blob);
    }
  }

  const blob = await zip.generateAsync({ type: 'blob' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = BACKUP_FOLDER_NAME + '.zip';
  a.click();
  URL.revokeObjectURL(url);
  showToast('Backup baixado! Extraia o arquivo .zip para ter a pasta completa no computador.');
}

async function importarBackupZip(file) {
  if (typeof JSZip === 'undefined') {
    showToast('Não foi possível importar: biblioteca de compactação não carregou.');
    return;
  }
  showToast('Importando backup, aguarde...');
  try {
    const zip = await JSZip.loadAsync(file);
    let registrosEntry = null;
    const fotoEntries = [];
    const docEntries = [];
    const legendaEntries = {};

    zip.forEach((relativePath, zipEntry) => {
      if (zipEntry.dir) return;
      const parts = relativePath.split('/').filter(Boolean);
      if (parts[parts.length - 1] === 'registros.json') { registrosEntry = zipEntry; return; }
      const idxFotos = parts.indexOf('fotos');
      if (idxFotos !== -1 && parts.length > idxFotos + 2) {
        const sgdFolder = parts[idxFotos + 1];
        const filename = parts[idxFotos + 2];
        if (filename === 'legendas.json') legendaEntries[sgdFolder] = zipEntry;
        else fotoEntries.push({ sgdFolder, filename, zipEntry });
        return;
      }
      const idxDocs = parts.indexOf('documentos');
      if (idxDocs !== -1 && parts.length > idxDocs + 2) {
        docEntries.push({ sgdFolder: parts[idxDocs + 1], filename: parts[idxDocs + 2], zipEntry });
      }
    });

    if (!registrosEntry) throw new Error('registros.json não encontrado no backup.');
    const importedData = JSON.parse(await registrosEntry.async('string'));
    if (!Array.isArray(importedData)) throw new Error('Formato de registros inválido.');

    const sgdToId = {};
    importedData.forEach((r) => { sgdToId[sanitizeName(r.sgd)] = r.id; });

    DATA = importedData;
    await persist();

    const fotosBySgd = {};
    for (const entry of fotoEntries) {
      if (!fotosBySgd[entry.sgdFolder]) fotosBySgd[entry.sgdFolder] = [];
      const base64 = await entry.zipEntry.async('base64');
      fotosBySgd[entry.sgdFolder].push({ filename: entry.filename, dataUrl: 'data:image/jpeg;base64,' + base64 });
    }
    for (const sgdFolder of Object.keys(fotosBySgd)) {
      const id = sgdToId[sgdFolder];
      if (!id) continue;
      let legendas = [];
      if (legendaEntries[sgdFolder]) {
        try { legendas = JSON.parse(await legendaEntries[sgdFolder].async('string')); } catch (e) { /* ignore */ }
      }
      fotosBySgd[sgdFolder].sort((a, b) => a.filename.localeCompare(b.filename, undefined, { numeric: true }));
      const photos = fotosBySgd[sgdFolder].map((f, i) => ({
        dataUrl: f.dataUrl,
        caption: legendas[i] ? legendas[i].legenda : '',
        tipo: legendas[i] ? legendas[i].tipo : 'depois',
      }));
      await savePhotosForRecord(id, photos);
    }

    for (const entry of docEntries) {
      const id = sgdToId[entry.sgdFolder];
      if (!id) continue;
      const base64 = await entry.zipEntry.async('base64');
      const mime = entry.filename.toLowerCase().endsWith('.pdf') ? 'application/pdf' : 'application/octet-stream';
      await saveDocForRecord(id, { name: entry.filename, dataUrl: `data:${mime};base64,${base64}` });
    }

    showToast(`Backup importado: ${importedData.length} registros restaurados.`);
    updateHeaderMeta();
    if (activeTab === 'painel') renderPainel();
    if (activeTab === 'registros') renderRegistros();
  } catch (err) {
    console.error(err);
    showToast('Erro ao importar backup: ' + (err && err.message ? err.message : 'arquivo inválido.'));
  }
}
</script>
<script>
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('tab-painel').style.display = tab === 'painel' ? 'block' : 'none';
  document.getElementById('tab-cadastro').style.display = tab === 'cadastro' ? 'block' : 'none';
  document.getElementById('tab-registros').style.display = tab === 'registros' ? 'block' : 'none';
  document.getElementById('tab-fotos').style.display = tab === 'fotos' ? 'block' : 'none';
  document.getElementById('tab-mapa').style.display = tab === 'mapa' ? 'block' : 'none';
  if (tab === 'painel') renderPainel();
  if (tab === 'cadastro') renderCadastro();
  if (tab === 'registros') renderRegistros();
  if (tab === 'fotos') renderFotos();
  if (tab === 'mapa') renderMapa();
}

function updateHeaderMeta() {
  document.getElementById('header-meta').textContent = `${DATA.length} SGDs no sistema`;
  document.getElementById('folder-status').innerHTML = '';
}

document.querySelectorAll('.tab-btn').forEach((btn) => {
  btn.onclick = () => switchTab(btn.dataset.tab);
});

document.getElementById('edit-modal-overlay').addEventListener('click', (e) => {
  if (e.target.id === 'edit-modal-overlay') closeEditModal();
});

window.addEventListener('error', (e) => {
  console.error('Erro não tratado:', e.error || e.message);
  try { showToast('Ocorreu um erro inesperado: ' + (e.message || 'veja o console para detalhes.')); } catch (_) {}
});
window.addEventListener('unhandledrejection', (e) => {
  console.error('Promessa rejeitada:', e.reason);
  try { showToast('Ocorreu um erro inesperado: ' + (e.reason && e.reason.message ? e.reason.message : 'veja o console para detalhes.')); } catch (_) {}
});

(async function init() {
  document.getElementById('btn-export-backup').onclick = exportarParaComputador;
  document.getElementById('btn-import-backup').onclick = () => document.getElementById('import-backup-input').click();
  document.getElementById('import-backup-input').onchange = (e) => {
    const file = e.target.files[0];
    if (file) importarBackupZip(file);
    e.target.value = '';
  };

  try {
    initSupabaseClient();
    await loadData();
    updateHeaderMeta();
    switchTab('painel');
  } catch (err) {
    console.error(err);
    showToast('Não foi possível conectar ao Supabase: ' + (err && err.message ? err.message : ''), 8000);
  }
})();
</script>
