const STATUS_LABEL_TO_KEY = Object.fromEntries(Object.entries(STATUS).map(([k, v]) => [v.toUpperCase(), k]));
const CATEGORIA_LABEL_TO_KEY = Object.fromEntries(Object.entries(CATEGORIAS).map(([k, v]) => [v.toUpperCase(), k]));

function parseExcelDate(val) {
  if (!val) return null;
  if (typeof val === 'string') {
    // aceita "27/01/2026" ou "2026-01-27"
    const br = val.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    if (br) return `${br[3]}-${br[2]}-${br[1]}`;
    const iso = val.match(/^\d{4}-\d{2}-\d{2}$/);
    if (iso) return val;
    return null;
  }
  if (typeof val === 'number' && typeof XLSX !== 'undefined') {
    const d = XLSX.SSF.parse_date_code(val);
    if (!d) return null;
    return `${d.y}-${String(d.m).padStart(2, '0')}-${String(d.d).padStart(2, '0')}`;
  }
  return null;
}

async function importarExcel(file) {
  if (typeof XLSX === 'undefined') {
    showToast('Não foi possível importar: biblioteca de planilhas não carregou.');
    return;
  }
  try {
    const buffer = await file.arrayBuffer();
    const wb = XLSX.read(buffer, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
    if (!rows.length) throw new Error('Planilha vazia.');

    const header = rows[0].map((h) => String(h).trim().toLowerCase());
    const idx = {
      sgd: header.indexOf('sgd'),
      local: header.indexOf('local'),
      regional: header.indexOf('regional'),
      categorias: header.indexOf('categorias'),
      status: header.indexOf('status'),
      dataSolic: header.findIndex((h) => h.includes('solicitacao') && h.includes('data')),
      dataExec: header.findIndex((h) => h.includes('execucao') && h.includes('data')),
      solicitacao: header.indexOf('solicitacao'),
      descricao: header.indexOf('descricao'),
      comentarios: header.indexOf('comentarios'),
    };
    if (idx.sgd === -1) throw new Error('Coluna "SGD" não encontrada. Use o arquivo exportado pelo próprio sistema.');

    const bySgd = {};
    DATA.forEach((r) => { bySgd[r.sgd.trim()] = r; });

    let atualizados = 0;
    const naoEncontrados = [];

    for (let i = 1; i < rows.length; i++) {
      const row = rows[i];
      const sgd = String(row[idx.sgd] || '').trim();
      if (!sgd) continue;
      const existing = bySgd[sgd];
      if (!existing) { naoEncontrados.push(sgd); continue; }

      if (idx.local !== -1 && row[idx.local]) existing.local = String(row[idx.local]).trim();
      if (idx.regional !== -1) existing.regional = row[idx.regional] ? String(row[idx.regional]).trim() : null;
      if (idx.categorias !== -1 && row[idx.categorias]) {
        const labels = String(row[idx.categorias]).split('+').map((s) => s.trim().toUpperCase());
        const cats = labels.map((l) => CATEGORIA_LABEL_TO_KEY[l]).filter(Boolean);
        existing.categorias = cats.length ? cats : existing.categorias;
      }
      if (idx.status !== -1 && row[idx.status]) {
        const key = STATUS_LABEL_TO_KEY[String(row[idx.status]).trim().toUpperCase()];
        if (key) existing.status = key;
      }
      if (idx.dataSolic !== -1) existing.dataSolicitacao = parseExcelDate(row[idx.dataSolic]) || existing.dataSolicitacao;
      if (idx.dataExec !== -1) existing.dataExecucao = parseExcelDate(row[idx.dataExec]);
      if (idx.solicitacao !== -1 && row[idx.solicitacao]) existing.solicitacao = String(row[idx.solicitacao]).trim();
      if (idx.descricao !== -1) existing.descricao = row[idx.descricao] ? String(row[idx.descricao]).trim() : existing.descricao;
      if (idx.comentarios !== -1) existing.comentarios = row[idx.comentarios] ? String(row[idx.comentarios]).trim() : null;

      const un = resolveUnit(existing.local);
      if (un) {
        if (!existing.regional) existing.regional = un.regional;
        if (hasCoord(un)) { existing.lat = un.lat; existing.lng = un.lng; }
      }
      atualizados++;
    }

    await persist();
    updateHeaderMeta();
    renderRegistros();

    let msg = `${atualizados} registro(s) atualizado(s) a partir do Excel.`;
    if (naoEncontrados.length) {
      msg += ` ${naoEncontrados.length} SGD(s) não encontrados e ignorados (ex: ${naoEncontrados.slice(0, 3).join(', ')}).`;
    }
    showToast(msg);
  } catch (err) {
    console.error(err);
    showToast('Erro ao importar Excel: ' + (err && err.message ? err.message : 'arquivo inválido.'));
  }
}

async function recalcularRegionais() {
  let updated = 0;
  DATA.forEach((r) => {
    if (!r.regional) {
      const unit = resolveUnit(r.local);
      if (unit) {
        r.regional = unit.regional;
        r.lat = hasCoord(unit) ? unit.lat : null;
        r.lng = hasCoord(unit) ? unit.lng : null;
        updated++;
      }
    } else if (r.lat == null) {
      const unit = resolveUnit(r.local);
      if (unit && hasCoord(unit)) { r.lat = unit.lat; r.lng = unit.lng; }
    }
  });
  if (updated > 0) {
    await persist();
    showToast(`${updated} registro(s) atualizados com a regional correspondente.`);
  } else {
    showToast('Nenhum registro novo para atualizar — os locais restantes não foram reconhecidos como unidades.');
  }
  renderRegistros();
}

/* ============ Modal de edição ============ */
function openEditModal(id) {
  const r = DATA.find((x) => x.id === id);
  if (!r) return;
  const overlay = document.getElementById('edit-modal-overlay');
  const content = document.getElementById('edit-modal-content');

  content.innerHTML = `
    <button class="modal-close" id="modal-close-btn" aria-label="Fechar">&times;</button>
    <h3>Editar SGD</h3>
    <div class="modal-sub mono">${escapeHtml(r.sgd)}</div>
    <div class="form-grid">
      <div class="field full">
        <label for="e-sgd">Número do SGD *</label>
        <input type="text" id="e-sgd" value="${escapeHtml(r.sgd)}">
      </div>
      <div class="field full">
        <label for="e-solicitacao">Resumo da solicitação *</label>
        <input type="text" id="e-solicitacao" value="${escapeHtml(r.solicitacao)}">
      </div>
      <div class="field full">
        <label for="e-descricao">Descrição completa</label>
        <textarea id="e-descricao" rows="3">${escapeHtml(r.descricao)}</textarea>
      </div>
      <div class="field">
        <label for="e-local">Unidade / Local *</label>
        <input type="text" id="e-local" list="e-local-datalist" autocomplete="off" value="${escapeHtml(r.local)}">
        <datalist id="e-local-datalist">
          ${UNITS.map((u) => `<option value="${escapeHtml(u.name)}">`).join('')}
        </datalist>
        <div class="hint" id="e-local-hint"></div>
        <label class="checkbox-item" style="margin-top:6px;font-size:12px;"><input type="checkbox" id="e-local-outro"> Não é uma unidade de saúde (órgão administrativo ou outro)</label>
        <label class="checkbox-item" id="e-remember-box" style="display:none;margin-top:6px;font-size:12px;"><input type="checkbox" id="e-remember"> <span id="e-remember-txt"></span></label>
      </div>
      <div class="field">
        <label for="e-regional">Regional</label>
        <select id="e-regional">
          <option value="">Não informado</option>
          ${REGIONAIS.map((x) => `<option value="${x}" ${r.regional === x ? 'selected' : ''}>${x}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label for="e-status">Status</label>
        <select id="e-status">${optionsHtml(STATUS, r.status, false, '')}</select>
      </div>
      <div class="field">
        <label for="e-prioridade">Prioridade</label>
        <select id="e-prioridade">
          <option value="" ${!r.prioridade ? 'selected' : ''}>Não definida</option>
          ${Object.entries(PRIORIDADES).map(([k, v]) => `<option value="${k}" ${r.prioridade === k ? 'selected' : ''}>${v}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label for="e-data-solic">Data da solicitação</label>
        <input type="date" id="e-data-solic" value="${r.dataSolicitacao || ''}">
      </div>
      <div class="field">
        <label for="e-data-exec">Data de execução</label>
        <input type="date" id="e-data-exec" value="${r.dataExecucao || ''}">
      </div>
      <div class="field full">
        <label>Categoria(s) de serviço</label>
        <div class="checkbox-grid">
          ${Object.entries(CATEGORIAS)
            .map(
              ([k, v]) => `
            <label class="checkbox-item"><input type="checkbox" value="${k}" ${r.categorias.includes(k) ? 'checked' : ''}> ${v}</label>`
            )
            .join('')}
        </div>
      </div>
      <div class="field full">
        <label for="e-comentarios">Comentários</label>
        <textarea id="e-comentarios" rows="3">${escapeHtml(r.comentarios || '')}</textarea>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" id="e-save">Salvar alterações</button>
      <button class="btn" id="e-cancel">Cancelar</button>
      <span class="spacer"></span>
      <button class="btn btn-danger" id="e-delete">Excluir SGD</button>
    </div>
    <div id="e-history"></div>
  `;

  overlay.classList.add('show');
  document.getElementById('modal-close-btn').onclick = closeEditModal;
  document.getElementById('e-cancel').onclick = closeEditModal;
  loadHistoryHtml(r.id).then((h) => { const el = document.getElementById('e-history'); if (el && h) el.innerHTML = h; });

  // unidade conhecida: preenche a regional sozinho
  const motivoAtual = classifyLocal(r.local).motivo;
  const podeLembrar = !!r.local && ['verificar', 'sem_regra', 'admin', 'outro', 'multi'].includes(motivoAtual);
  document.getElementById('e-local').addEventListener('input', (e) => {
    const unit = resolveUnit(e.target.value);
    const hint = document.getElementById('e-local-hint');
    if (unit) {
      if (REGIONAIS.includes(unit.regional)) document.getElementById('e-regional').value = unit.regional;
      hint.textContent = `Regional preenchida automaticamente: ${unit.regional} (${unit.rede})`;
    } else {
      hint.textContent = '';
    }
    // local que o sistema não reconhecia: oferece guardar o nome antigo como apelido da unidade escolhida
    const box = document.getElementById('e-remember-box');
    const mudou = normalizeUnitName(e.target.value) !== normalizeUnitName(r.local);
    if (podeLembrar && unit && mudou) {
      box.style.display = 'flex';
      document.getElementById('e-remember-txt').textContent = `Lembrar: sempre que aparecer «${r.local}», usar ${unit.name}`;
      document.getElementById('e-remember').checked = ['verificar', 'sem_regra'].includes(motivoAtual);
    } else {
      box.style.display = 'none';
    }
  });

  // ao marcar como finalizado sem data de execução, sugere a data de hoje (editável)
  document.getElementById('e-status').addEventListener('change', (e) => {
    const inp = document.getElementById('e-data-exec');
    if (e.target.value === 'finalizado' && !inp.value) inp.value = todayISO();
  });

  document.getElementById('e-save').onclick = async () => {
    const val = (k) => document.getElementById(k).value;
    const sgd = val('e-sgd').trim();
    const solicitacao = val('e-solicitacao').trim();
    let local = val('e-local').trim();
    if (!sgd || !solicitacao || !local) {
      showToast('Preencha os campos obrigatórios (*).');
      return;
    }
    if (DATA.some((x) => x.id !== r.id && x.sgd === sgd)) {
      showToast('Já existe outro registro com esse número de SGD.');
      return;
    }
    // se o local foi trocado, ele precisa ser uma unidade da lista (ou marcado como "não é unidade de saúde")
    const localAntigo = r.local;
    let unidadeEscolhida = null;
    if (local !== r.local && !document.getElementById('e-local-outro').checked) {
      const c = classifyLocal(local);
      if (!c.unit) {
        showToast('Escolha uma unidade da lista: digite e selecione uma das opções. Se o local não for uma unidade de saúde, marque a caixa abaixo do campo.', 8000);
        return;
      }
      unidadeEscolhida = c.unit;
      local = c.unit.name;
    }
    const cats = Array.from(content.querySelectorAll('.checkbox-grid input:checked')).map((i) => i.value);
    const upd = Object.assign({}, r, {
      sgd,
      solicitacao,
      descricao: val('e-descricao').trim(),
      local,
      regional: val('e-regional') || null,
      status: val('e-status'),
      prioridade: val('e-prioridade') || null,
      dataSolicitacao: val('e-data-solic') || null,
      dataExecucao: val('e-data-exec') || null,
      comentarios: val('e-comentarios').trim() || null,
      categorias: cats.length ? cats : ['outros'],
    });
    if (local !== r.local) {
      upd.lat = unidadeEscolhida && hasCoord(unidadeEscolhida) ? unidadeEscolhida.lat : null;
      upd.lng = unidadeEscolhida && hasCoord(unidadeEscolhida) ? unidadeEscolhida.lng : null;
    }
    const lembrar = document.getElementById('e-remember-box').style.display !== 'none' && document.getElementById('e-remember').checked;
    const saveBtn = document.getElementById('e-save');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Salvando...';
    const ok = await persistRecord(upd, { acao: 'editou', antes: Object.assign({}, r) });
    if (!ok) {
      saveBtn.disabled = false;
      saveBtn.textContent = 'Salvar alterações';
      return;
    }
    Object.assign(r, upd);
    closeEditModal();
    showToast(`SGD ${r.sgd} atualizado.`);
    updateHeaderMeta();
    // guarda o nome antigo como apelido da unidade escolhida (se a tabela não existir, avisa depois do aviso de sucesso)
    if (lembrar && unidadeEscolhida) await saveAlias(localAntigo, unidadeEscolhida.name);
    if (activeTab === 'painel') renderPainel();
    if (activeTab === 'registros') renderRegistros();
    if (activeTab === 'mapa') renderMapa();
  };

  document.getElementById('e-delete').onclick = async () => {
    const ok = confirm(
      `Excluir o SGD ${r.sgd}?\n\nAs fotos e o PDF vinculados a ele também serão apagados. Essa ação não pode ser desfeita.\n\nDica: use "Salvar cópia (.zip)" no topo da página antes de excluir.`
    );
    if (!ok) return;
    const btn = document.getElementById('e-delete');
    btn.disabled = true;
    btn.textContent = 'Excluindo...';
    try {
      await deleteRecordCompletely(r.id);
      DATA = DATA.filter((x) => x.id !== r.id);
      closeEditModal();
      showToast(`SGD ${r.sgd} excluído.`);
      updateHeaderMeta();
      if (activeTab === 'painel') renderPainel();
      if (activeTab === 'registros') renderRegistros();
      if (activeTab === 'mapa') renderMapa();
    } catch (err) {
      console.error(err);
      showToast('Erro ao excluir: ' + (err && err.message ? err.message : 'tente novamente.'), 8000);
      btn.disabled = false;
      btn.textContent = 'Excluir SGD';
    }
  };
}

function closeEditModal() {
  document.getElementById('edit-modal-overlay').classList.remove('show');
}
</script>
<script>
/* ============ Mapa ============ */
let leafletMap = null;
let mapActiveRegion = 'Todos';
const MAP_REGIONS = ['Todos', 'Leste', 'Norte', 'Oeste', 'Sul', 'Rural', 'SMS'];

function countOpenByUnitName(unitName) {
  const normTarget = normalizeUnitName(unitName);
  return DATA.filter((r) => {
    if (r.status === 'finalizado' || r.status === 'recusado') return false;
    return normalizeUnitName(r.local) === normTarget;
  }).length;
}

function recordsForUnitName(unitName) {
  const normTarget = normalizeUnitName(unitName);
  return DATA.filter((r) => normalizeUnitName(r.local) === normTarget);
}

let mapOnlyOpen = false;
let mapIdx = {};
let mapMarkers = [];
let mapLayersCtl = null;

/* Agrupa os SGDs por unidade uma única vez (evita recalcular para cada pin) */
let mapUnlinked = [];

function buildMapIndex() {
  const idx = {};
  mapUnlinked = [];
  DATA.forEach((r) => {
    const { unit, motivo } = classifyLocal(r.local);
    if (!unit) { mapUnlinked.push({ r, motivo }); return; }
    const k = normalizeUnitName(unit.name);
    const e = idx[k] || (idx[k] = { all: [], open: [] });
    e.all.push(r);
    if (r.status !== 'finalizado' && r.status !== 'recusado') e.open.push(r);
  });
  mapIdx = idx;
}
function mapEntry(unitName) {
  return mapIdx[normalizeUnitName(unitName)] || { all: [], open: [] };
}

function mapUnitsFiltered() {
  const searchEl = document.getElementById('map-search');
  const q = ((searchEl && searchEl.value) || '').toLowerCase();
  return UNITS.filter((u) => {
    const okRegion = mapActiveRegion === 'Todos' || u.regional === mapActiveRegion;
    const okSearch = !q || u.name.toLowerCase().includes(q) || (u.endereco || '').toLowerCase().includes(q);
    const okOpen = !mapOnlyOpen || mapEntry(u.name).open.length > 0;
    return okRegion && okSearch && okOpen;
  });
}

const UNL_MOTIVOS = {
  verificar: ['Local ambíguo — escolha a unidade correta', 'O nome serve para mais de uma unidade ou não dá para saber qual é.'],
  sem_regra: ['Local não reconhecido', 'Esse nome não corresponde a nenhuma unidade cadastrada.'],
  vazio: ['Sem local informado', 'O SGD está sem unidade.'],
  multi: ['Vários locais no mesmo SGD', 'O pino só aceita uma unidade por SGD. Escolha a principal ou divida em SGDs separados.'],
  admin: ['Órgão administrativo', 'Diretorias, secretarias e coordenadorias não têm pino no mapa.'],
  outro: ['Não é uma unidade de saúde', 'Empresa, câmara ou local não informado.'],
};

function openUnlinkedModal() {
  const abertos = mapUnlinked.filter((x) => x.r.status !== 'finalizado' && x.r.status !== 'recusado');
  const fechados = mapUnlinked.length - abertos.length;
  const overlay = document.getElementById('edit-modal-overlay');
  const content = document.getElementById('edit-modal-content');
  const grupos = {};
  abertos.forEach((x) => { (grupos[x.motivo] = grupos[x.motivo] || []).push(x.r); });
  const ordem = ['verificar', 'sem_regra', 'vazio', 'multi', 'admin', 'outro'];
  content.innerHTML = `
    <button class="modal-close" id="unl-close" aria-label="Fechar">&times;</button>
    <h3>SGDs em aberto fora do mapa</h3>
    <div class="modal-sub">${abertos.length} SGD(s) em aberto não estão ligados a nenhuma unidade com pino${fechados ? ` (além de ${fechados} já finalizados ou recusados)` : ''}. Use "Corrigir" para escolher a unidade certa.</div>
    <div class="unl-scroll">
      ${abertos.length ? ordem.filter((m) => grupos[m]).map((m) => `
        <div class="unl-group">${UNL_MOTIVOS[m][0]} (${grupos[m].length})</div>
        <div class="unl-hint">${UNL_MOTIVOS[m][1]}</div>
        ${grupos[m].map((r) => `
          <div class="unl-row">
            <span class="sgd-code">${escapeHtml(r.sgd)}</span>
            <span><span class="loc">${escapeHtml(r.local || '(sem local)')}</span><span class="txt">${escapeHtml(r.solicitacao || r.descricao || '')}</span></span>
            <button class="btn btn-sm" data-fix="${r.id}">Corrigir</button>
          </div>`).join('')}
      `).join('') : '<div class="empty-state"><h3>Tudo certo</h3><p>Todos os SGDs em aberto estão ligados a uma unidade do mapa.</p></div>'}
    </div>
  `;
  overlay.classList.add('show');
  document.getElementById('unl-close').onclick = closeEditModal;
  content.querySelectorAll('[data-fix]').forEach((b) => { b.onclick = () => openEditModal(b.dataset.fix); });
}

/* Ficha da unidade quando ela ainda não tem posição no mapa */
function openUnitInfoModal(unit) {
  const { html } = unitPopupHtml(unit);
  const overlay = document.getElementById('edit-modal-overlay');
  const content = document.getElementById('edit-modal-content');
  content.innerHTML = `<button class="modal-close" id="uinfo-close" aria-label="Fechar">&times;</button>${html}`;
  overlay.classList.add('show');
  document.getElementById('uinfo-close').onclick = closeEditModal;
  bindPopupActions(unit, closeEditModal);
}

/* ---- Cadastrar unidade nova e definir posição clicando no mapa ---- */
function openNewUnitModal() {
  const overlay = document.getElementById('edit-modal-overlay');
  const content = document.getElementById('edit-modal-content');
  content.innerHTML = `
    <button class="modal-close" id="nu-close" aria-label="Fechar">&times;</button>
    <h3>Cadastrar unidade</h3>
    <div class="modal-sub">Depois de salvar, clique no mapa para marcar onde ela fica.</div>
    <div class="form-grid">
      <div class="field full"><label for="nu-nome">Nome da unidade *</label><input type="text" id="nu-nome" placeholder="ex: USF Jardim Passaredo"></div>
      <div class="field"><label for="nu-regional">Regional</label><select id="nu-regional">${REGIONAIS.map((x) => `<option value="${x}">${x}</option>`).join('')}</select></div>
      <div class="field"><label for="nu-rede">Rede</label><select id="nu-rede"><option>PRIMÁRIA</option><option>SECUNDÁRIA</option><option>TERCIÁRIA</option></select></div>
      <div class="field full"><label for="nu-end">Endereço</label><input type="text" id="nu-end" placeholder="ex: Avenida D, s/n - Jardim Passaredo"></div>
    </div>
    <div class="form-actions"><button class="btn btn-primary" id="nu-save">Salvar e marcar no mapa</button><button class="btn" id="nu-cancel">Cancelar</button></div>`;
  overlay.classList.add('show');
  document.getElementById('nu-close').onclick = closeEditModal;
  document.getElementById('nu-cancel').onclick = closeEditModal;
  document.getElementById('nu-save').onclick = async () => {
    const nome = document.getElementById('nu-nome').value.trim();
    if (!nome) { showToast('Informe o nome da unidade.'); return; }
    if (findUnitByExactName(nome)) { showToast('Já existe uma unidade com esse nome.'); return; }
    const unit = {
      name: nome, lat: null, lng: null, regional: document.getElementById('nu-regional').value,
      rede: document.getElementById('nu-rede').value, endereco: document.getElementById('nu-end').value.trim(),
    };
    if (!(await saveUnitRow(unit))) return;
    UNITS.push(unit);
    rebuildUnitIndex();
    closeEditModal();
    showToast('Unidade cadastrada.');
    renderMapa();
    startPickPosition(unit);
  };
}

function startPickPosition(unit) {
  const map = vecMap || leafletMap;
  const box = document.getElementById('leaflet-map');
  if (!map || !box) { showToast('Abra o mapa para definir a posição.'); return; }
  closeEditModal();
  if (vecPopup) { try { vecPopup.remove(); } catch (_) {} }
  const banner = document.createElement('div');
  banner.className = 'pick-banner';
  banner.textContent = `Clique no mapa para marcar a posição de ${unit.name}. Esc cancela.`;
  box.appendChild(banner);
  box.style.cursor = 'crosshair';
  let onKey, onClick;
  const fim = () => {
    banner.remove();
    box.style.cursor = '';
    map.off('click', onClick);
    document.removeEventListener('keydown', onKey);
  };
  onKey = (e) => { if (e.key === 'Escape') fim(); };
  onClick = async (e) => {
    const lat = e.lngLat ? e.lngLat.lat : e.latlng.lat;
    const lng = e.lngLat ? e.lngLat.lng : e.latlng.lng;
    fim();
    if (!confirm(`Salvar esta posição para ${unit.name}?\n\nLatitude ${lat.toFixed(6)}, longitude ${lng.toFixed(6)}`)) return;
    const novo = Object.assign({}, unit, { lat: Number(lat.toFixed(6)), lng: Number(lng.toFixed(6)), aproximada: false });
    if (await saveUnitRow(novo)) {
      unit.lat = novo.lat; unit.lng = novo.lng; unit.aproximada = false;
      showToast('Posição salva.');
      renderMapa();
    }
  };
  map.on('click', onClick);
  document.addEventListener('keydown', onKey);
}

/* ---- Pinos no mesmo endereço ficam num só (o número soma os SGDs em aberto) ---- */
function spotKey(u) { return u.lat.toFixed(5) + ',' + u.lng.toFixed(5); }
function mapPointGroups(units) {
  const g = {};
  units.forEach((u) => { (g[spotKey(u)] = g[spotKey(u)] || []).push(u); });
  return Object.values(g);
}
function spotUnits(unit) {
  if (!hasCoord(unit)) return [unit];
  const k = spotKey(unit);
  return UNITS.filter((u) => hasCoord(u) && spotKey(u) === k);
}

function renderMapa() {
  const el = document.getElementById('tab-mapa');
  destroyMaps();
  buildMapIndex();
  el.innerHTML = `
    <div class="section-title">Mapa das unidades de saúde</div>
    <div class="map-layout card">
      <div class="map-sidebar">
        <input type="text" id="map-search" placeholder="Buscar unidade..." style="margin-bottom:10px;">
        <div class="map-chip-row" id="map-chips"></div>
        <label class="map-toggle"><input type="checkbox" id="map-only-open" ${mapOnlyOpen ? 'checked' : ''}> Somente unidades com SGD em aberto</label>
        <div class="map-legend">
          <span><i class="open"></i>Com SGD em aberto (o número é a quantidade)</span>
          <span><i></i>Sem SGD em aberto (cor da regional)</span>
          <span>Unidades no mesmo endereço ficam num só pino; o número soma os SGDs.</span>
        </div>
        <button class="btn btn-sm map-unl-btn" id="map-unl-btn"></button>
        <button class="btn btn-sm map-unl-btn" id="map-new-unit">Cadastrar nova unidade</button>
        <div class="map-summary" id="map-summary"></div>
        <div id="map-unit-list"></div>
      </div>
      <div id="leaflet-map"></div>
    </div>
  `;

  MAP_REGIONS.forEach((r) => {
    const chip = document.createElement('div');
    chip.className = 'map-chip' + (mapActiveRegion === r ? ' active' : '');
    const color = r === 'Todos' ? '#1B5E3C' : (REGION_COLOR[r] || '#5B6B6A');
    chip.innerHTML = `<span class="dot" style="background:${color}"></span>${r}`;
    chip.onclick = () => { mapActiveRegion = r; renderMapa(); };
    document.getElementById('map-chips').appendChild(chip);
  });

  document.getElementById('map-search').oninput = debounce(() => renderMapUnitList(), 200);
  document.getElementById('map-only-open').onchange = (e) => { mapOnlyOpen = e.target.checked; renderMapa(); };
  const unlAbertos = mapUnlinked.filter((x) => x.r.status !== 'finalizado' && x.r.status !== 'recusado').length;
  const unlBtn = document.getElementById('map-unl-btn');
  unlBtn.textContent = unlAbertos ? `${unlAbertos} SGD(s) em aberto fora do mapa — ver e corrigir` : 'Todos os SGDs em aberto estão no mapa';
  unlBtn.onclick = openUnlinkedModal;
  document.getElementById('map-new-unit').onclick = openNewUnitModal;

  renderMapUnitList();
  initMap();
}

function renderMapUnitList() {
  const listEl = document.getElementById('map-unit-list');
  const units = mapUnitsFiltered()
    .map((u) => ({ u, open: mapEntry(u.name).open.length }))
    .sort((x, y) => y.open - x.open || x.u.name.localeCompare(y.u.name));
  const unitsAbertas = units.filter((x) => x.open > 0).length;
  const totalAbertos = units.reduce((n, x) => n + x.open, 0);
  const semPos = units.filter((x) => !hasCoord(x.u)).length;
  document.getElementById('map-summary').textContent =
    `${units.length} unidades — ${unitsAbertas} com SGD em aberto (${totalAbertos} no total)` + (semPos ? `; ${semPos} ainda sem posição no mapa` : '');
  listEl.innerHTML = units
    .map(({ u, open }) => `<div class="unit-item ${open > 0 ? 'has-open' : ''}" data-unit="${escapeHtml(u.name)}">
        <div class="u-name">${escapeHtml(u.name)}</div>
        <div class="u-meta">${u.regional} · ${u.rede}</div>
        ${open > 0 ? `<span class="u-count">${open} SGD(s) em aberto</span>` : ''}${hasCoord(u) ? '' : '<span class="u-pend">posição a confirmar</span>'}
      </div>`)
    .join('');
  listEl.querySelectorAll('[data-unit]').forEach((item) => {
    item.onclick = () => {
      const unit = UNITS.find((u) => u.name === item.dataset.unit);
      if (unit) focusUnit(unit);
    };
  });
}

/* Pino no estilo do Google Maps: vermelho com o número de SGDs em aberto; verde/regional quando não há */
function pinSvgMarkup(openCount, color) {
  const has = openCount > 0;
  const fill = has ? '#C8382D' : color;
  const w = has ? 34 : 24, h = has ? 44 : 32;
  const label = openCount > 99 ? '99+' : String(openCount);
  const svg = has
    ? `<svg width="${w}" height="${h}" viewBox="0 0 34 44" xmlns="http://www.w3.org/2000/svg">
        <path d="M17 43C17 43 32 27.5 32 16.5C32 8 25.3 2 17 2C8.7 2 2 8 2 16.5C2 27.5 17 43 17 43Z" fill="${fill}" stroke="#fff" stroke-width="2"/>
        <circle cx="17" cy="16.5" r="9.5" fill="#fff"/>
        <text x="17" y="20.6" text-anchor="middle" font-size="${label.length > 2 ? 9 : 12}" font-weight="700" fill="${fill}" font-family="Space Grotesk, Arial, sans-serif">${label}</text>
      </svg>`
    : `<svg width="${w}" height="${h}" viewBox="0 0 24 32" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 31C12 31 22 19.5 22 11.5C22 5.7 17.5 1.5 12 1.5C6.5 1.5 2 5.7 2 11.5C2 19.5 12 31 12 31Z" fill="${fill}" stroke="#fff" stroke-width="1.6"/>
        <circle cx="12" cy="11.5" r="4" fill="#fff"/>
      </svg>`;
  return { svg, w, h, has };
}

/* Pino para o Leaflet (mapa de reserva) */
function pinIcon(openCount, color) {
  const p = pinSvgMarkup(openCount, color);
  return L.divIcon({ className: 'map-pin', html: p.svg, iconSize: [p.w, p.h], iconAnchor: [p.w / 2, p.h - 1], popupAnchor: [0, -p.h + 6] });
}

/* ============ Mapa vetorial (MapLibre + OpenFreeMap), com Leaflet de reserva ============ */
let vecMap = null;
let vecPopup = null;
let vecSat = false;
let vec3d = false;

function destroyMaps() {
  if (vecPopup) { try { vecPopup.remove(); } catch (_) {} vecPopup = null; }
  if (vecMap) { try { vecMap.remove(); } catch (_) {} vecMap = null; }
  if (leafletMap) { try { leafletMap.remove(); } catch (_) {} leafletMap = null; }
}

function canUseVectorMap() {
  if (typeof maplibregl === 'undefined') return false;
  try {
    const c = document.createElement('canvas');
    return !!(c.getContext('webgl2') || c.getContext('webgl'));
  } catch (_) { return false; }
}

function initMap() {
  if (canUseVectorMap()) {
    try { initVectorMap(); return; } catch (e) { console.error('Mapa vetorial indisponível:', e); destroyMaps(); }
  }
  if (typeof L !== 'undefined') { initLeafletMap(); return; }
  document.getElementById('leaflet-map').innerHTML =
    '<div class="empty-state"><h3>Não foi possível carregar o mapa</h3><p>Verifique sua conexão com a internet e recarregue a página.</p></div>';
}

function fallbackToLeaflet(motivo) {
  console.warn('Usando o mapa de reserva:', motivo);
  const box = document.getElementById('leaflet-map');
  destroyMaps();
  if (box) box.innerHTML = '';
  if (typeof L !== 'undefined') {
    initLeafletMap();
    showToast('Mapa alternativo ativado.');
  } else if (box) {
    box.innerHTML = '<div class="empty-state"><h3>Não foi possível carregar o mapa</h3><p>Verifique sua conexão com a internet e recarregue a página.</p></div>';
  }
}

function initVectorMap() {
  vecSat = false;
  vec3d = false;
  const box = document.getElementById('leaflet-map');
  vecMap = new maplibregl.Map({
    container: box,
    style: 'https://tiles.openfreemap.org/styles/liberty',
    center: [-56.097, -15.601],
    zoom: 11.3,
    attributionControl: { compact: true },
  });
  const map = vecMap;
  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
  map.addControl(new maplibregl.FullscreenControl(), 'top-right');
  map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-left');

  // barra Mapa / Satélite / 3D
  const tools = document.createElement('div');
  tools.className = 'map-tools';
  tools.innerHTML = '<button data-m="ruas" class="active">Mapa</button><button data-m="sat">Satélite</button><button data-m="3d">3D</button>';
  box.appendChild(tools);
  const setActive = () => {
    tools.querySelector('[data-m=ruas]').classList.toggle('active', !vecSat);
    tools.querySelector('[data-m=sat]').classList.toggle('active', vecSat);
    tools.querySelector('[data-m="3d"]').classList.toggle('active', vec3d);
  };
  const ensureSat = () => {
    if (map.getSource('sat')) return;
    map.addSource('sat', {
      type: 'raster', tileSize: 256, maxzoom: 19,
      tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
      attribution: 'Imagens &copy; Esri, Maxar, Earthstar Geographics',
    });
    const primeiroRotulo = (map.getStyle().layers.find((l) => l.type === 'symbol') || {}).id;
    map.addLayer({ id: 'sat', type: 'raster', source: 'sat', layout: { visibility: 'none' } }, primeiroRotulo);
  };
  tools.onclick = (e) => {
    const m = e.target && e.target.dataset && e.target.dataset.m;
    if (!m) return;
    if (m === 'ruas' || m === 'sat') {
      vecSat = m === 'sat';
      const apply = () => { ensureSat(); map.setLayoutProperty('sat', 'visibility', vecSat ? 'visible' : 'none'); };
      if (map.isStyleLoaded()) apply(); else map.once('load', apply);
    } else {
      vec3d = !vec3d;
      map.easeTo({ pitch: vec3d ? 55 : 0, bearing: vec3d ? -20 : 0, duration: 700 });
    }
    setActive();
  };

  // pinos
  const shown = mapUnitsFiltered().filter(hasCoord);
  const bounds = new maplibregl.LngLatBounds();
  mapPointGroups(shown).forEach((grupo) => {
    const n = grupo.reduce((t, u) => t + mapEntry(u.name).open.length, 0);
    const color = grupo.length === 1 ? (REGION_COLOR[grupo[0].regional] || '#5B6B6A') : '#5B6B6A';
    const p = pinSvgMarkup(n, color);
    const el = document.createElement('div');
    el.className = 'vec-pin';
    el.title = grupo.map((u) => u.name).join(' / ');
    el.style.width = p.w + 'px';
    el.style.height = p.h + 'px';
    el.style.zIndex = n > 0 ? String(1000 + n) : '0';
    el.innerHTML = p.svg;
    el.addEventListener('click', (ev) => { ev.stopPropagation(); openPointPopup(grupo); });
    new maplibregl.Marker({ element: el, anchor: 'bottom' }).setLngLat([grupo[0].lng, grupo[0].lat]).addTo(map);
    bounds.extend([grupo[0].lng, grupo[0].lat]);
  });
  if (shown.length > 1) map.fitBounds(bounds, { padding: 70, maxZoom: 15, duration: 0 });
  else if (shown.length === 1) map.jumpTo({ center: [shown[0].lng, shown[0].lat], zoom: 15 });

  // se o estilo não carregar (sem internet, bloqueio de rede), volta para o mapa de reserva
  let carregou = false;
  map.on('load', () => { carregou = true; });
  map.on('error', (ev) => { if (!carregou && vecMap === map) fallbackToLeaflet(ev && ev.error ? ev.error.message : 'erro'); });
  setTimeout(() => { if (!carregou && vecMap === map) fallbackToLeaflet('tempo esgotado'); }, 12000);
}

function focusUnit(unit) {
  if (!hasCoord(unit)) { openUnitInfoModal(unit); return; }
  if (vecMap) {
    vecMap.flyTo({ center: [unit.lng, unit.lat], zoom: 16, duration: 900 });
    openUnitPopup(unit);
  } else if (leafletMap) {
    leafletMap.setView([unit.lat, unit.lng], 16);
    openUnitPopup(unit);
  }
}

function initLeafletMap() {
  if (leafletMap) { try { leafletMap.remove(); } catch (_) {} leafletMap = null; }
  leafletMap = L.map('leaflet-map', { zoomControl: true }).setView([-15.601, -56.097], 12);

  // Camadas de mapa que não exigem chave nem cabeçalho Referer (o OpenStreetMap bloqueia esse tipo de acesso)
  const carto = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    subdomains: 'abcd', maxZoom: 20, attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
  });
  const esriRuas = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19, attribution: 'Tiles &copy; Esri',
  });
  const satImg = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19, attribution: 'Tiles &copy; Esri, Maxar, Earthstar Geographics',
  });
  const satNomes = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19,
  });
  const satelite = L.layerGroup([satImg, satNomes]);

  carto.addTo(leafletMap);
  mapLayersCtl = L.control.layers({ 'Mapa': carto, 'Satélite': satelite }, null, { position: 'topright' }).addTo(leafletMap);
  L.control.scale({ imperial: false }).addTo(leafletMap);

  // se o provedor principal falhar por completo, troca automaticamente para o alternativo
  let erros = 0, ok = 0, trocou = false;
  carto.on('tileload', () => { ok++; });
  carto.on('tileerror', () => {
    erros++;
    if (!trocou && ok === 0 && erros >= 6) {
      trocou = true;
      leafletMap.removeLayer(carto);
      esriRuas.addTo(leafletMap);
      mapLayersCtl.removeLayer(carto);
      mapLayersCtl.addBaseLayer(esriRuas, 'Mapa');
      showToast('Mapa base alternativo ativado.');
    }
  });

  mapMarkers = [];
  mapPointGroups(mapUnitsFiltered().filter(hasCoord)).forEach((grupo) => {
    const n = grupo.reduce((t, u) => t + mapEntry(u.name).open.length, 0);
    const color = grupo.length === 1 ? (REGION_COLOR[grupo[0].regional] || '#5B6B6A') : '#5B6B6A';
    const marker = L.marker([grupo[0].lat, grupo[0].lng], { icon: pinIcon(n, color), title: grupo.map((u) => u.name).join(' / '), zIndexOffset: n > 0 ? 1000 + n : 0 }).addTo(leafletMap);
    marker.on('click', () => openPointPopup(grupo));
    mapMarkers.push(marker);
  });
}

function unitPopupHtml(unit) {
  const e = mapEntry(unit.name);
  const recs = e.all;
  const abertos = e.open.slice().sort((a, b) => (a.dataSolicitacao || '').localeCompare(b.dataSolicitacao || ''));
  const lista = abertos.slice(0, 5)
    .map((r) => `<div class="pop-sgd"><b>${escapeHtml(r.sgd)}</b>${statusPillHtml(r.status)}<span class="txt">${escapeHtml(r.solicitacao || r.descricao || '')}</span></div>`)
    .join('');
  const temPos = hasCoord(unit);
  const gmPlace = temPos ? 'https://www.google.com/maps/search/?api=1&query=' + unit.lat + ',' + unit.lng : '';
  const gmRota = temPos ? 'https://www.google.com/maps/dir/?api=1&destination=' + unit.lat + ',' + unit.lng : '';
  const nota = !temPos
    ? '<div class="pop-note">Posição no mapa ainda não definida.</div>'
    : (unit.aproximada ? '<div class="pop-note">Posição aproximada — use "Ajustar posição" para corrigir.</div>' : '');
  const html = `
    <div class="pop-title">${escapeHtml(unit.name)}</div>
    <div class="pop-addr">${escapeHtml(unit.endereco || '')}</div>
    <div style="font-size:11.5px;margin-bottom:4px;">${unit.regional} · ${unit.rede}</div>
    <div style="font-size:12px;">${recs.length} SGD(s) registrados — <b>${abertos.length} em aberto</b></div>
    ${nota}
    ${abertos.length ? `<div class="pop-sgds">${lista}${abertos.length > 5 ? `<div class="pop-sgd">e mais ${abertos.length - 5} em aberto</div>` : ''}</div>` : ''}
    <div class="pop-actions">
      ${recs.length ? `<span class="pop-link" id="pop-view-records">Ver registros desta unidade</span>` : ''}
      <span class="pop-link" id="pop-setpos">${temPos ? 'Ajustar posição' : 'Definir posição no mapa'}</span>
      ${temPos ? `<a href="${gmPlace}" target="_blank" rel="noopener">Abrir no Google Maps</a><a href="${gmRota}" target="_blank" rel="noopener">Como chegar</a>` : ''}
    </div>
  `;
  return { html, abertos: abertos.length };
}

function showMapPopup(lat, lng, html, alto) {
  if (vecMap) {
    if (vecPopup) { try { vecPopup.remove(); } catch (_) {} }
    vecPopup = new maplibregl.Popup({ offset: [0, alto ? -44 : -32], maxWidth: '320px', closeButton: true })
      .setLngLat([lng, lat])
      .setHTML(html)
      .addTo(vecMap);
  } else if (leafletMap) {
    L.popup({ offset: [0, alto ? -34 : -22], maxWidth: 310 }).setLatLng([lat, lng]).setContent(html).openOn(leafletMap);
  }
}

function bindPopupActions(unit, antesDeNavegar) {
  setTimeout(() => {
    const link = document.getElementById('pop-view-records');
    if (link) {
      link.onclick = () => {
        if (antesDeNavegar) antesDeNavegar();
        registrosFilters = { regional: 'all', categoria: 'all', status: 'all', prioridade: 'all', sort: 'recentes', search: unit.name };
        registrosPage = 1;
        switchTab('registros');
      };
    }
    const sp = document.getElementById('pop-setpos');
    if (sp) sp.onclick = () => startPickPosition(unit);
  }, 50);
}

function openUnitPopup(unit) {
  if (!hasCoord(unit)) { openUnitInfoModal(unit); return; }
  const { html } = unitPopupHtml(unit);
  const alto = spotUnits(unit).some((u) => mapEntry(u.name).open.length > 0);
  showMapPopup(unit.lat, unit.lng, html, alto);
  bindPopupActions(unit);
}

/* clique num pino: uma unidade abre a ficha; várias no mesmo endereço abrem a lista */
function openPointPopup(grupo) {
  if (grupo.length === 1) { openUnitPopup(grupo[0]); return; }
  const itens = grupo
    .map((u) => ({ u, n: mapEntry(u.name).open.length }))
    .sort((x, y) => y.n - x.n || x.u.name.localeCompare(y.u.name))
    .map(({ u, n }) => `<div class="pop-grp-item" data-u="${escapeHtml(u.name)}"><b>${escapeHtml(u.name)}</b><span>${n} em aberto</span></div>`)
    .join('');
  const html = `<div class="pop-title">${grupo.length} unidades neste endereço</div>
    <div class="pop-addr">Clique numa unidade para ver os detalhes.</div>
    <div class="pop-sgds">${itens}</div>`;
  showMapPopup(grupo[0].lat, grupo[0].lng, html, grupo.some((u) => mapEntry(u.name).open.length > 0));
  setTimeout(() => {
    document.querySelectorAll('.pop-grp-item').forEach((el) => {
      el.onclick = () => {
        const u = UNITS.find((x) => x.name === el.dataset.u);
        if (u) openUnitPopup(u);
      };
    });
  }, 50);
}

/* ============ Relatório Fotográfico ============ */
let fotosSelectedRecord = null;
let fotosCurrentPhotos = [];
let fotosCurrentDoc = null;

let fotoIndex = null;
let fotoGalleryFilters = { search: '', regional: 'all', status: 'all' };
let fotoGalleryPage = 1;
const FOTO_GALLERY_PAGE = 12;

async function loadFotoIndex() {
  const [f, d] = await Promise.all([
    sb.from('cs_fotos').select('registro_id, storage_path, tipo, ordem').order('ordem', { ascending: true }),
    sb.from('cs_documentos').select('registro_id, file_name'),
  ]);
  if (f.error) throw f.error;
  const map = {};
  const get = (id) => map[id] || (map[id] = { registroId: id, count: 0, thumb: null, thumbPri: 9, hasDoc: false });
  (f.data || []).forEach((x) => {
    const m = get(x.registro_id);
    m.count++;
    const pri = x.tipo === 'depois' ? 0 : x.tipo === 'durante' ? 1 : 2;
    if (pri < m.thumbPri) { m.thumb = x.storage_path; m.thumbPri = pri; }
  });
  (d && d.data ? d.data : []).forEach((x) => { get(x.registro_id).hasDoc = true; });
  fotoIndex = Object.values(map);
}

function refreshFotoGallery() {
  return loadFotoIndex().then(renderFotoGallery).catch((e) => {
    console.error(e);
    const box = document.getElementById('foto-gallery');
    if (box) box.innerHTML = '<div class="empty-state"><h3>Não foi possível carregar os relatórios</h3><p>' + escapeHtml(e && e.message ? e.message : '') + '</p></div>';
  });
}

function renderFotoGallery() {
  const box = document.getElementById('foto-gallery');
  if (!box) return;
  if (!fotoIndex) { box.innerHTML = '<div class="hint">Carregando relatórios…</div>'; return; }
  const byId = new Map(DATA.map((r) => [r.id, r]));
  const f = fotoGalleryFilters;
  const q = (f.search || '').toLowerCase();
  let items = fotoIndex
    .map((ix) => ({ ix, r: byId.get(ix.registroId) }))
    .filter(({ r }) => r)
    .filter(({ r }) => f.regional === 'all' || (f.regional === 'nao_informado' ? !r.regional : r.regional === f.regional))
    .filter(({ r }) => f.status === 'all' || r.status === f.status)
    .filter(({ r }) => !q || (r.sgd + ' ' + r.local + ' ' + r.solicitacao).toLowerCase().includes(q));
  items.sort((a, b) =>
    (b.r.dataExecucao || b.r.dataSolicitacao || '').localeCompare(a.r.dataExecucao || a.r.dataSolicitacao || '') ||
    (b.r.sgd || '').localeCompare(a.r.sgd || ''));

  const totalPages = Math.max(1, Math.ceil(items.length / FOTO_GALLERY_PAGE));
  if (fotoGalleryPage > totalPages) fotoGalleryPage = totalPages;
  const page = items.slice((fotoGalleryPage - 1) * FOTO_GALLERY_PAGE, fotoGalleryPage * FOTO_GALLERY_PAGE);

  if (!items.length) {
    box.innerHTML = `<div class="card empty-state"><h3>Nenhum relatório fotográfico encontrado</h3>
      <p>${fotoIndex.length ? 'Ajuste os filtros acima.' : 'Os SGDs aparecem aqui assim que receberem fotos ou PDF, pelo botão "Dar baixa" ou pelo formulário acima.'}</p></div>`;
    return;
  }
  box.innerHTML = `
    <div class="hint" style="margin-bottom:8px;">${items.length} ${items.length === 1 ? 'SGD com fotos ou PDF' : 'SGDs com fotos ou PDF'}</div>
    <div class="gal-grid">
      ${page.map(({ ix, r }) => `
        <div class="gal-card" data-open="${r.id}" tabindex="0" role="button" aria-label="Abrir relatório do SGD ${escapeHtml(r.sgd)}">
          <div class="gal-thumb">${ix.thumb ? `<img loading="lazy" src="${publicUrl(ix.thumb)}" alt="">` : 'Somente PDF'}</div>
          <div class="gal-body">
            <span class="sgd-code">${escapeHtml(r.sgd)}</span>
            <span class="place">${escapeHtml(r.local)}</span>
            <span class="desc">${escapeHtml(r.solicitacao)}</span>
            <div class="gal-meta">
              ${statusPillHtml(r.status)}
              ${ix.count ? `<span class="gal-chip">${ix.count} ${ix.count === 1 ? 'foto' : 'fotos'}</span>` : ''}
              ${ix.hasDoc ? '<span class="gal-chip pdf">PDF</span>' : ''}
              ${r.dataExecucao ? `<span class="gal-chip">${fmtDateBR(r.dataExecucao)}</span>` : ''}
            </div>
          </div>
        </div>`).join('')}
    </div>
    <div class="pagination">
      <span>Página ${fotoGalleryPage} de ${totalPages}</span>
      <div class="pg-btns">
        <button class="btn btn-sm" id="gal-prev" ${fotoGalleryPage <= 1 ? 'disabled' : ''}>Anterior</button>
        <button class="btn btn-sm" id="gal-next" ${fotoGalleryPage >= totalPages ? 'disabled' : ''}>Próxima</button>
      </div>
    </div>`;
  const open = async (id) => {
    await selectFotoRecord(id);
    const area = document.getElementById('foto-selected-area');
    if (area && area.scrollIntoView) area.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
  box.querySelectorAll('[data-open]').forEach((c) => {
    c.onclick = () => open(c.dataset.open);
    c.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(c.dataset.open); } };
  });
  const pv = document.getElementById('gal-prev'), nx = document.getElementById('gal-next');
  if (pv) pv.onclick = () => { fotoGalleryPage--; renderFotoGallery(); };
  if (nx) nx.onclick = () => { fotoGalleryPage++; renderFotoGallery(); };
}

function resizeImageFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 1280;
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round((height * maxDim) / width); width = maxDim; }
          else { width = Math.round((width * maxDim) / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handleFotoFiles(fileList) {
  const files = Array.from(fileList || []);
  for (const file of files) {
    try {

async function exportFotoPDF() {
  const r = fotosSelectedRecord;
  if (!r) return;
  if (typeof window.jspdf === 'undefined' || typeof html2canvas === 'undefined') {
    showToast('Não foi possível gerar o PDF: bibliotecas não carregaram. Verifique sua conexão.');
    return;
  }
  const btn = document.getElementById('btn-export-foto-pdf');
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Gerando PDF...';
  const container = document.createElement('div');
  container.style.position = 'fixed';
  container.style.left = '-9999px';
  container.style.top = '0';
  container.style.width = '780px';
  container.style.background = '#fff';
  container.style.padding = '24px';
  container.className = 'pf-pdf-render';
  container.innerHTML = buildFotoReportInnerHtml(r, fotosCurrentPhotos);
  document.body.appendChild(container);
  try {
    const canvas = await html2canvas(container, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
    const imgData = canvas.toDataURL('image/jpeg', 0.92);
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'pt', 'a4');
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const imgWidth = pageWidth;
    const imgHeight = (canvas.height * imgWidth) / canvas.width;
    let heightLeft = imgHeight;
    let position = 0;
    pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
    while (heightLeft > 0) {
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }
    pdf.save(`relatorio-fotografico-${sanitizeName(r.sgd)}.pdf`);
  } catch (err) {
    console.error(err);
    showToast('Erro ao gerar PDF: ' + (err && err.message ? err.message : 'tente novamente.'));
  } finally {
    document.body.removeChild(container);
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
}

<script>
/* ============ Helpers compartilhados: fotos e documento por registro (Supabase) ============ */
async function loadPhotosForRecord(id) {
  try {
    const { data, error } = await sb.from('cs_fotos').select('*').eq('registro_id', id).order('ordem', { ascending: true });
    if (error) throw error;
    return (data || []).map((r) => ({
      dataUrl: publicUrl(r.storage_path),
      caption: r.caption || '',
      tipo: r.tipo || 'depois',
      storagePath: r.storage_path,
      dbId: r.id,
    }));
  } catch (e) {
    console.error(e);
    return [];
  }
}

async function savePhotosForRecord(id, photos) {
  try {
    const { data: existingRows, error: selErr } = await sb.from('cs_fotos').select('id, storage_path').eq('registro_id', id);
    if (selErr) throw selErr;
    const keepPaths = new Set(photos.filter((p) => p.storagePath).map((p) => p.storagePath));
    const toDelete = (existingRows || []).filter((r) => !keepPaths.has(r.storage_path));
    if (toDelete.length) {
      await sb.from('cs_fotos').delete().in('id', toDelete.map((r) => r.id));
      await sb.storage.from(window.SUPABASE_BUCKET).remove(toDelete.map((r) => r.storage_path));
    }
    for (let i = 0; i < photos.length; i++) {
      const p = photos[i];
      if (!p.storagePath) {
        const blob = dataURLToBlob(p.dataUrl);
        const path = 'fotos/' + id + '/' + genId() + '.jpg';
        const { error: upErr } = await sb.storage.from(window.SUPABASE_BUCKET).upload(path, blob, { contentType: 'image/jpeg' });
        if (upErr) throw upErr;
        const { data: row, error: insErr } = await sb
          .from('cs_fotos')
          .insert({ registro_id: id, storage_path: path, caption: p.caption || '', tipo: p.tipo || 'depois', ordem: i })
          .select()
          .single();
        if (insErr) throw insErr;
        p.storagePath = path;
        p.dbId = row.id;
      } else {
        await sb.from('cs_fotos').update({ caption: p.caption || '', tipo: p.tipo || 'depois', ordem: i }).eq('registro_id', id).eq('storage_path', p.storagePath);
      }
    }
    return true;
  } catch (e) {
    console.error(e);
    showToast('Erro ao salvar fotos: ' + (e && e.message ? e.message : ''));
    return false;
  }
}

async function loadDocForRecord(id) {
  try {
    const { data, error } = await sb.from('cs_documentos').select('*').eq('registro_id', id).maybeSingle();
    if (error) throw error;
    if (!data) return null;
    return { name: data.file_name || 'documento.pdf', dataUrl: publicUrl(data.storage_path), storagePath: data.storage_path };
  } catch (e) {
    console.error(e);
    return null;
  }
}

async function saveDocForRecord(id, doc) {
  try {
    const { data: existing } = await sb.from('cs_documentos').select('storage_path').eq('registro_id', id).maybeSingle();
    if (doc) {
      if (doc.dataUrl && doc.dataUrl.indexOf('data:') === 0) {
        const blob = dataURLToBlob(doc.dataUrl);
        const path = 'documentos/' + id + '/' + genId() + '-' + sanitizeName(doc.name) + '.pdf';
        const { error: upErr } = await sb.storage.from(window.SUPABASE_BUCKET).upload(path, blob, { contentType: 'application/pdf' });
        if (upErr) throw upErr;
        const { error: upsertErr } = await sb
          .from('cs_documentos')
          .upsert({ registro_id: id, storage_path: path, file_name: doc.name, uploaded_at: new Date().toISOString() }, { onConflict: 'registro_id' });
        if (upsertErr) throw upsertErr;
        if (existing && existing.storage_path && existing.storage_path !== path) {
          await sb.storage.from(window.SUPABASE_BUCKET).remove([existing.storage_path]);
        }
      }
      return true;
    } else {
      await sb.from('cs_documentos').delete().eq('registro_id', id);
      if (existing && existing.storage_path) {
        await sb.storage.from(window.SUPABASE_BUCKET).remove([existing.storage_path]);
      }
      return true;
    }
  } catch (e) {
    console.error(e);
    showToast('Erro ao salvar o documento: ' + (e && e.message ? e.message : ''));
    return false;
  }
}
function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (ev) => resolve(ev.target.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* Renders a small "attach one PDF" widget into #<containerId>.
   doc: {name, dataUrl, size} | null. onChange(newDocOrNull) is called after add/remove. */
function renderDocArea(containerId, doc, onChange) {
  const el = document.getElementById(containerId);
  if (!el) return;
  if (doc) {
    el.innerHTML = `
      <div class="card" style="padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
        <div style="font-size:12.8px;">📄 <a href="${doc.dataUrl}" download="${escapeHtml(doc.name)}" style="color:var(--navy);font-weight:500;">${escapeHtml(doc.name)}</a></div>
        <button class="btn-ghost no-print" id="${containerId}-remove" style="color:var(--st-rec-fg);">Remover PDF</button>
      </div>`;
    document.getElementById(containerId + '-remove').onclick = () => onChange(null);
  } else {
    el.innerHTML = `
      <div class="upload-drop no-print" id="${containerId}-drop" style="padding:16px;">
        Clique para anexar um PDF (comprovante, laudo, medição...)
        <input type="file" id="${containerId}-input" accept="application/pdf" style="display:none;">
      </div>`;
    document.getElementById(containerId + '-drop').onclick = () => document.getElementById(containerId + '-input').click();
    document.getElementById(containerId + '-input').onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 4 * 1024 * 1024) {
        showToast('PDF muito grande (máx. ~4MB). Escolha um arquivo menor.');
        return;
      }
      const dataUrl = await readFileAsDataURL(file);
      onChange({ name: file.name, dataUrl, size: file.size });
    };
  }
}

/* ============ Modal: Dar baixa no serviço ============ */
let baixaPhotos = [];
let baixaDoc = null;
let baixaDocExisted = false;
let baixaRecordId = null;

async function openBaixaModal(id) {
  const r = DATA.find((x) => x.id === id);
  if (!r) return;
  baixaRecordId = id;
  baixaPhotos = await loadPhotosForRecord(id);
  baixaDoc = await loadDocForRecord(id);
  baixaDocExisted = !!baixaDoc;

  const overlay = document.getElementById('edit-modal-overlay');
  const content = document.getElementById('edit-modal-content');
  const defaultStatus = r.status === 'nao_iniciado' ? 'finalizado' : r.status;

  content.innerHTML = `
    <button class="modal-close" id="baixa-close-btn">&times;</button>
    <h3 class="mono">${escapeHtml(r.sgd)}</h3>
    <div class="modal-sub">${escapeHtml(r.local)} — ${escapeHtml(r.solicitacao)}</div>
    <div class="form-grid">
      <div class="field">
        <label for="b-status">Status</label>
        <select id="b-status">${optionsHtml(STATUS, defaultStatus, false, '')}</select>
      </div>
      <div class="field">
        <label for="b-data-exec">Data de execução</label>
        <input type="date" id="b-data-exec" value="${r.dataExecucao || todayISO()}">
      </div>
      <div class="field full">
        <label for="b-obs">Observação</label>
        <textarea id="b-obs" rows="3" placeholder="Descreva o que foi executado...">${escapeHtml(r.comentarios || '')}</textarea>
      </div>
      <div class="field full">
        <label>Documento (PDF)</label>
        <div id="baixa-doc-area"></div>
      </div>
      <div class="field full">
        <label>Fotos do serviço executado</label>
        <div class="upload-drop no-print" id="baixa-upload-drop" style="margin-top:6px;">
          Clique ou arraste fotos aqui
          <input type="file" id="baixa-file-input" accept="image/*" multiple style="display:none;">
        </div>
        <div class="foto-grid" id="baixa-foto-grid"></div>
        <div class="hint">Essas fotos ficam disponíveis também na aba Relatório Fotográfico.</div>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" id="b-save">Salvar baixa</button>
      <button class="btn" id="b-cancel">Cancelar</button>
    </div>
  `;

  overlay.classList.add('show');
  document.getElementById('baixa-close-btn').onclick = closeBaixaModal;
  document.getElementById('b-cancel').onclick = closeBaixaModal;
  document.getElementById('baixa-upload-drop').onclick = () => document.getElementById('baixa-file-input').click();
  document.getElementById('baixa-file-input').onchange = async (e) => {
    const files = Array.from(e.target.files || []);
    for (const file of files) {
      try {
        const dataUrl = await resizeImageFile(file);
        baixaPhotos.push({ dataUrl, caption: '', tipo: 'depois' });
      } catch (err) { console.error(err); }
    }
    renderBaixaFotoGrid();
  };
  renderBaixaFotoGrid();
  renderDocArea('baixa-doc-area', baixaDoc, handleBaixaDocChange);

  document.getElementById('b-save').onclick = async () => {
    const saveBtn = document.getElementById('b-save');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Salvando...';
    try {
      const upd = Object.assign({}, r, {
        status: document.getElementById('b-status').value,
        dataExecucao: document.getElementById('b-data-exec').value || null,
        comentarios: document.getElementById('b-obs').value.trim() || null,
      });
      if (!(await persistRecord(upd, { acao: 'baixa', antes: Object.assign({}, r) }))) throw new Error('não foi possível gravar o registro.');
      Object.assign(r, upd);
      await savePhotosForRecord(id, baixaPhotos);
      // só chama delete se de fato existia um PDF antes (evita erro ao "remover" algo que nunca existiu)
      if (baixaDoc) {
        await saveDocForRecord(id, baixaDoc);
      } else if (baixaDocExisted) {
        await saveDocForRecord(id, null);
      }
      const savedPhotos = baixaPhotos.slice();
      const savedDoc = baixaDoc;
      closeBaixaModal();
      updateHeaderMeta();
      if (activeTab === 'painel') renderPainel();
      if (activeTab === 'registros') renderRegistros();
      showToast(`Baixa registrada para o SGD ${r.sgd}. Abrindo relatório fotográfico...`);
      // leva direto para a aba de relatório fotográfico, já com tudo carregado
      switchTab('fotos');
      fotosSelectedRecord = r;
      fotosCurrentPhotos = savedPhotos;
      fotosCurrentDoc = savedDoc;
      renderFotoSelectedArea();
    } catch (err) {
      console.error(err);
      showToast('Erro ao salvar a baixa: ' + (err && err.message ? err.message : 'tente novamente.'));
      saveBtn.disabled = false;
      saveBtn.textContent = 'Salvar baixa';
    }
  };
}

function handleBaixaDocChange(newDoc) {
  baixaDoc = newDoc;
  renderDocArea('baixa-doc-area', baixaDoc, handleBaixaDocChange);
}

function renderBaixaFotoGrid() {
  const grid = document.getElementById('baixa-foto-grid');
  if (!grid) return;
  grid.innerHTML = baixaPhotos
    .map(
      (p, i) => `
    <div class="foto-item">
      <img src="${p.dataUrl}" alt="Foto ${i + 1}">
      <div class="foto-meta">
        <select data-idx="${i}" class="baixa-foto-tipo">
          <option value="antes" ${p.tipo === 'antes' ? 'selected' : ''}>Antes</option>
          <option value="durante" ${p.tipo === 'durante' ? 'selected' : ''}>Durante</option>
          <option value="depois" ${p.tipo === 'depois' ? 'selected' : ''}>Depois</option>
        </select>
        <input type="text" data-idx="${i}" class="baixa-foto-legenda" placeholder="Legenda..." value="${escapeHtml(p.caption || '')}">
        <button class="foto-remove no-print" data-idx="${i}">Remover foto</button>
      </div>
    </div>`
    )
    .join('');
  grid.querySelectorAll('.baixa-foto-tipo').forEach((sel) => {
    sel.onchange = (e) => { baixaPhotos[+e.target.dataset.idx].tipo = e.target.value; };
  });
  grid.querySelectorAll('.baixa-foto-legenda').forEach((inp) => {
    inp.oninput = (e) => { baixaPhotos[+e.target.dataset.idx].caption = e.target.value; };
  });
  grid.querySelectorAll('.foto-remove').forEach((btn) => {
    btn.onclick = (e) => { baixaPhotos.splice(+e.target.dataset.idx, 1); renderBaixaFotoGrid(); };
  });
}

function closeBaixaModal() {
  document.getElementById('edit-modal-overlay').classList.remove('show');
  baixaRecordId = null;
  baixaPhotos = [];
  baixaDoc = null;
  baixaDocExisted = false;
}
</script>
<script>
/* ============ Backup: salvar tudo em pasta no computador ============ */
function sanitizeName(s) {
  return String(s || 'sem-sgd').replace(/[\/\\:*?"<>|]/g, '_').trim() || 'sem-sgd';
}

function dataURLToBlob(dataUrl) {
  const [header, base64] = dataUrl.split(',');
  const mimeMatch = header.match(/data:(.*?);base64/);
  const mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';
  const bin = atob(base64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

async function writeFileHandle(dirHandle, name, content) {
  const fileHandle = await dirHandle.getFileHandle(name, { create: true });
  const writable = await fileHandle.createWritable();
  await writable.write(content);
  await writable.close();
}

const BACKUP_FOLDER_NAME = 'Controle de Serviços de Manutenção';

async function coletarDadosParaBackup(onProgress) {
  const fotosPorRegistro = [];
  const docsPorRegistro = [];
  for (let i = 0; i < DATA.length; i++) {
    const r = DATA[i];
    const photos = await loadPhotosForRecord(r.id);
    if (photos.length) fotosPorRegistro.push({ sgd: r.sgd, photos });
    const doc = await loadDocForRecord(r.id);
    if (doc) docsPorRegistro.push({ sgd: r.sgd, doc });
    if (onProgress && i % 80 === 0) onProgress(i, DATA.length);
  }
  return { fotosPorRegistro, docsPorRegistro };
}

async function exportarParaComputador() {
  const btn = document.getElementById('btn-export-backup');
  btn.disabled = true;
  const originalLabel = btn.textContent;
  btn.textContent = 'Preparando...';
  try {
    if (window.showDirectoryPicker) {
      try {
        await exportViaFileSystemAPI();
        return;
      } catch (err) {
        if (err && err.name === 'AbortError') { return; } // usuário cancelou a escolha da pasta
        console.warn('File System Access API indisponível ou falhou, usando .zip como alternativa:', err);
      }
    }
    await exportarBackupZip();
  } finally {
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
}

async function exportViaFileSystemAPI() {
  const parentHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
  const rootHandle = await parentHandle.getDirectoryHandle(BACKUP_FOLDER_NAME, { create: true });
  showToast('Salvando dados na pasta escolhida...');
  await writeFileHandle(rootHandle, 'registros.json', JSON.stringify(DATA, null, 2));

  const { fotosPorRegistro, docsPorRegistro } = await coletarDadosParaBackup();

  if (fotosPorRegistro.length) {
    const fotosHandle = await rootHandle.getDirectoryHandle('fotos', { create: true });
    for (const item of fotosPorRegistro) {
      const folder = await fotosHandle.getDirectoryHandle(sanitizeName(item.sgd), { create: true });
      for (let i = 0; i < item.photos.length; i++) {
        const p = item.photos[i];
        await writeFileHandle(folder, `${i + 1}_${p.tipo || 'foto'}.jpg`, await urlToBlob(p.dataUrl));
      }
      await writeFileHandle(
        folder,
        'legendas.json',
        JSON.stringify(item.photos.map((p) => ({ tipo: p.tipo, legenda: p.caption })), null, 2)
      );
    }
  }
  if (docsPorRegistro.length) {
    const docsHandle = await rootHandle.getDirectoryHandle('documentos', { create: true });
    for (const item of docsPorRegistro) {
      const folder = await docsHandle.getDirectoryHandle(sanitizeName(item.sgd), { create: true });
      await writeFileHandle(folder, item.doc.name, await urlToBlob(item.doc.dataUrl));
    }
  }
  showToast(`Pasta "${BACKUP_FOLDER_NAME}" salva com sucesso no local escolhido!`);
}

async function exportarBackupZip() {
  if (typeof JSZip === 'undefined') {
    showToast('Não foi possível gerar o backup: biblioteca de compactação não carregou. Verifique sua conexão e tente novamente.');
    return;
  }
  showToast('Preparando backup, aguarde alguns segundos...');
  const zip = new JSZip();
  const root = zip.folder(BACKUP_FOLDER_NAME);
  root.file('registros.json', JSON.stringify(DATA, null, 2));

  const { fotosPorRegistro, docsPorRegistro } = await coletarDadosParaBackup();

  if (fotosPorRegistro.length) {
    const fotosRoot = root.folder('fotos');
    for (const item of fotosPorRegistro) {
      const folder = fotosRoot.folder(sanitizeName(item.sgd));
      for (let i = 0; i < item.photos.length; i++) {
        const p = item.photos[i];
        const blob = await urlToBlob(p.dataUrl);
        folder.file(`${i + 1}_${p.tipo || 'foto'}.jpg`, blob);
      }
      folder.file('legendas.json', JSON.stringify(item.photos.map((p) => ({ tipo: p.tipo, legenda: p.caption })), null, 2));
    }
  }
  if (docsPorRegistro.length) {
    const docsRoot = root.folder('documentos');
    for (const item of docsPorRegistro) {
      const folder = docsRoot.folder(sanitizeName(item.sgd));
      const blob = await urlToBlob(item.doc.dataUrl);
      folder.file(item.doc.name, blob);
    }
  }

  const blob = await zip.generateAsync({ type: 'blob' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = BACKUP_FOLDER_NAME + '.zip';
  a.click();
  URL.revokeObjectURL(url);
  showToast('Backup baixado! Extraia o arquivo .zip para ter a pasta completa no computador.');
}

async function importarBackupZip(file) {
  if (typeof JSZip === 'undefined') {
    showToast('Não foi possível importar: biblioteca de compactação não carregou.');
    return;
  }
  showToast('Importando backup, aguarde...');
  try {
    const zip = await JSZip.loadAsync(file);
    let registrosEntry = null;
    const fotoEntries = [];
    const docEntries = [];
    const legendaEntries = {};

    zip.forEach((relativePath, zipEntry) => {
      if (zipEntry.dir) return;
      const parts = relativePath.split('/').filter(Boolean);
      if (parts[parts.length - 1] === 'registros.json') { registrosEntry = zipEntry; return; }
      const idxFotos = parts.indexOf('fotos');
      if (idxFotos !== -1 && parts.length > idxFotos + 2) {
        const sgdFolder = parts[idxFotos + 1];
        const filename = parts[idxFotos + 2];
        if (filename === 'legendas.json') legendaEntries[sgdFolder] = zipEntry;
        else fotoEntries.push({ sgdFolder, filename, zipEntry });
        return;
      }
      const idxDocs = parts.indexOf('documentos');
      if (idxDocs !== -1 && parts.length > idxDocs + 2) {
        docEntries.push({ sgdFolder: parts[idxDocs + 1], filename: parts[idxDocs + 2], zipEntry });
      }
    });

    if (!registrosEntry) throw new Error('registros.json não encontrado no backup.');
    const importedData = JSON.parse(await registrosEntry.async('string'));
    if (!Array.isArray(importedData)) throw new Error('Formato de registros inválido.');

    const sgdToId = {};
    importedData.forEach((r) => { sgdToId[sanitizeName(r.sgd)] = r.id; });

    DATA = importedData;
    await persist();

    const fotosBySgd = {};
    for (const entry of fotoEntries) {
      if (!fotosBySgd[entry.sgdFolder]) fotosBySgd[entry.sgdFolder] = [];
      const base64 = await entry.zipEntry.async('base64');
      fotosBySgd[entry.sgdFolder].push({ filename: entry.filename, dataUrl: 'data:image/jpeg;base64,' + base64 });
    }
    for (const sgdFolder of Object.keys(fotosBySgd)) {
      const id = sgdToId[sgdFolder];
      if (!id) continue;
      let legendas = [];
      if (legendaEntries[sgdFolder]) {
        try { legendas = JSON.parse(await legendaEntries[sgdFolder].async('string')); } catch (e) { /* ignore */ }
      }
      fotosBySgd[sgdFolder].sort((a, b) => a.filename.localeCompare(b.filename, undefined, { numeric: true }));
      const photos = fotosBySgd[sgdFolder].map((f, i) => ({
        dataUrl: f.dataUrl,
        caption: legendas[i] ? legendas[i].legenda : '',
        tipo: legendas[i] ? legendas[i].tipo : 'depois',
      }));
      await savePhotosForRecord(id, photos);
    }

    for (const entry of docEntries) {
      const id = sgdToId[entry.sgdFolder];
      if (!id) continue;
      const base64 = await entry.zipEntry.async('base64');
      const mime = entry.filename.toLowerCase().endsWith('.pdf') ? 'application/pdf' : 'application/octet-stream';
      await saveDocForRecord(id, { name: entry.filename, dataUrl: `data:${mime};base64,${base64}` });
    }

    showToast(`Backup importado: ${importedData.length} registros restaurados.`);
    updateHeaderMeta();
    if (activeTab === 'painel') renderPainel();
    if (activeTab === 'registros') renderRegistros();
  } catch (err) {
    console.error(err);
    showToast('Erro ao importar backup: ' + (err && err.message ? err.message : 'arquivo inválido.'));
  }
}
</script>
<script>
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('tab-painel').style.display = tab === 'painel' ? 'block' : 'none';
  document.getElementById('tab-cadastro').style.display = tab === 'cadastro' ? 'block' : 'none';
  document.getElementById('tab-registros').style.display = tab === 'registros' ? 'block' : 'none';
  document.getElementById('tab-fotos').style.display = tab === 'fotos' ? 'block' : 'none';
  document.getElementById('tab-mapa').style.display = tab === 'mapa' ? 'block' : 'none';
  if (tab === 'painel') renderPainel();
  if (tab === 'cadastro') renderCadastro();
  if (tab === 'registros') renderRegistros();
  if (tab === 'fotos') renderFotos();
  if (tab === 'mapa') renderMapa();
}

function updateHeaderMeta() {
  document.getElementById('header-meta').textContent = `${DATA.length} SGDs no sistema`;
  document.getElementById('folder-status').innerHTML = '';
}

document.querySelectorAll('.tab-btn').forEach((btn) => {
  btn.onclick = () => switchTab(btn.dataset.tab);
});

document.getElementById('edit-modal-overlay').addEventListener('click', (e) => {
  if (e.target.id === 'edit-modal-overlay') closeEditModal();
});

window.addEventListener('error', (e) => {
  console.error('Erro não tratado:', e.error || e.message);
  try { showToast('Ocorreu um erro inesperado: ' + (e.message || 'veja o console para detalhes.')); } catch (_) {}
});
window.addEventListener('unhandledrejection', (e) => {
  console.error('Promessa rejeitada:', e.reason);
  try { showToast('Ocorreu um erro inesperado: ' + (e.reason && e.reason.message ? e.reason.message : 'veja o console para detalhes.')); } catch (_) {}
});

function showConnectionError(err) {
  ['painel', 'cadastro', 'registros', 'fotos', 'mapa'].forEach((t) => {
    document.getElementById('tab-' + t).style.display = 'none';
  });
  document.getElementById('header-meta').textContent = 'sem conexão com o banco de dados';
  const g = document.getElementById('gate-screen');
  g.className = 'gate-screen';
  g.style.display = 'flex';
  const msg = err && err.message ? err.message : 'erro desconhecido';
  g.innerHTML = `
    <div class="card gate-card">
      <div class="gate-icon">⚠️</div>
      <h2>Não foi possível carregar os dados</h2>
      <p>${escapeHtml(msg)}</p>
      <div class="gate-warning">
        Confira se o arquivo <b>supabase-config.js</b> está publicado na mesma pasta do <b>index.html</b>
        e se a tabela <b>cs_registros</b> permite leitura para a chave pública (anon) no Supabase.
      </div>
      <button class="btn btn-primary" id="gate-retry">Tentar novamente</button>
    </div>`;
  document.getElementById('gate-retry').onclick = () => bootApp();
}

let realtimeStarted = false;
function startRealtime() {
  if (realtimeStarted || !sb) return;
  realtimeStarted = true;
  try {
    sb.channel('cs-registros-live')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'cs_registros' }, debounce(async () => {
        // não atrapalha quem está com um formulário aberto ou digitando
        if (document.getElementById('edit-modal-overlay').classList.contains('show')) return;
        const ae = document.activeElement;
        if (ae && ['INPUT', 'SELECT', 'TEXTAREA'].includes(ae.tagName)) return;
        try {
          await loadData();
          updateHeaderMeta();
          if (activeTab === 'painel') renderPainel();
          if (activeTab === 'registros') renderRegistros();
        } catch (_) {}
      }, 800))
      .subscribe();
  } catch (e) {
    console.warn('Atualização em tempo real indisponível:', e);
  }
}

async function bootApp() {
  document.getElementById('gate-screen').style.display = 'none';
  try {
    if (!sb) initSupabaseClient();
    await loadData();
    await loadUnitExtras();
    updateHeaderMeta();
    switchTab(activeTab || 'painel');
    startRealtime();
  } catch (err) {
    console.error(err);
    showConnectionError(err);
  }
}

(async function init() {
  document.getElementById('btn-export-backup').onclick = exportarParaComputador;
  document.getElementById('btn-import-backup').onclick = () => document.getElementById('import-backup-input').click();
  document.getElementById('import-backup-input').onchange = (e) => {
    const file = e.target.files[0];
    if (file) importarBackupZip(file);
    e.target.value = '';
  };

  await bootApp();
})();
</script>
</body></html>
